<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>TurboFlow Workbench</title>
  <meta name="description" content="Set up a CFD case on your geometry, run it, and read drag, lift, convergence and forces back in the browser." />
  <!-- SVG first: browsers that support it get a mark that stays sharp at any
       size, and the PNGs below stay as the fallback. -->
  <link rel="icon" href="/icon.svg" type="image/svg+xml" />
  <link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png" />
  <link rel="icon" href="/icon-192.png" sizes="192x192" type="image/png" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" sizes="180x180" />
  <link rel="canonical" href="https://turboflow-test.web.app/workbench" />

  <meta property="og:title" content="TurboFlow Workbench" />
  <meta property="og:description" content="Set up a CFD case on your geometry, run it, and read drag, lift, convergence and forces back in the browser." />

  <!-- Demo mode (?demo=1) swaps the live backend for an in-memory one seeded
       with real solver output. It exists because Google sign-in is not enabled
       yet (HANDOVER.md 14.1) and without it this page cannot be opened at all. -->
  <script>window.DEMO_MODE = new URLSearchParams(location.search).has("demo");</script>
  <!-- Backend. The Workbench was written against Supabase; workbench-adapter.js
       answers the same calls out of Firestore, so this page barely changed. -->
  <script>
    if (window.DEMO_MODE) {
      document.write('<script src="demo/demo-data.js"><\/script>');
    } else {
      document.write(''
        + '<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"><\/script>'
        + '<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-auth-compat.js"><\/script>'
        + '<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore-compat.js"><\/script>'
        + '<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-storage-compat.js"><\/script>'
        + '<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-functions-compat.js"><\/script>'
        + '<script src="firebase-config.js"><\/script>'
        + '<script src="workbench-adapter.js"><\/script>');
    }
  </script>
  <!-- three's examples/jsm modules (GLTFLoader, OrbitControls) import the bare
       specifier "three" internally, which a browser cannot resolve on its own.
       Without this map the whole viewer module fails at import and never runs:
       renderGlb/applyField/setClip are simply never defined, the viewport stays
       empty and nothing is logged. Must come before any type=module script. -->
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"
    }
  }
  </script>
  <script src="cfd-setup.js"></script>
  <script src="workbench-panels.js"></script>
  <script src="workbench-results.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap');
    /* Design tokens, taken from the main TurboFlow app so the Workbench and
       the site read as one product rather than two.

       Dark, because this is looked at for hours and the thing that should be
       bright is the result, not the chrome. Every value below has a counterpart
       in src/styles.css; where a number differs it is noted why. */
    :root {
      /* Greys straight from the app: slate-950 ground, slate-900 panels,
         slate-850 raised, and the same #2e2e2e rule between them. */
      --bg:#141414; --panel:#1e1e1e; --panel-2:#2e2e2e; --inset:#181818;
      --rule:#2e2e2e; --rule-strong:rgba(90,90,90,0.35);

      /* ink-3 carries 10px uppercase labels (24 section eyebrows, 5 ribbon
         labels), so it has to clear WCAG AA at small sizes. var(--ink-3) on the
         #1e1e1e panel is 4.86:1, and stays a step below ink-2 so the
         label-against-value hierarchy survives. Anything lighter collapses the
         two into one grey. */
      --ink:#eeeeee; --ink-2:#aaaaaa; --ink-3:#888888;

      /* The app's industrial blue, with its cyan as the lifted state. The
         accent means "this is selected" and nothing else; nothing here is
         coloured for decoration. */
      --accent:#4a90d9; --accent-hi:#5bc4d8; --accent-wash:rgba(74,144,217,0.10);
      --accent-strong:#3a7bc8; --on-accent:#ffffff; --ink-4:#666666;
      --scrim:rgba(0,0,0,0.55);
      --ok:#5de88a; --warn:#ffc830; --bad:#ff8585;

      --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:24px; --s6:32px;

      /* The app's radii: 6px on controls, 8px on cards and inputs. */
      /* One radius, everywhere. The three names stay so the twenty call sites
         do not all have to change, but they are one value now: the rules ask
         for a single small radius, and three that differed by two pixels was
         a design system in name only. */
      --r1:4px; --r2:4px; --r3:4px;

      /* One family across the whole site now. The app was on Inter, which the
         design rules ban outright, so it moved here rather than the other way:
         IBM Plex Sans is not on the banned list and the Workbench was already
         using it. Three weights, 400 / 600 / 700. */
      --font:"IBM Plex Sans",sans-serif;
      --mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,monospace;

      /* The app's modal shadow, used for anything that floats above the
         surface and nothing that does not. */
      --shadow-card:0 32px 80px rgba(0,0,0,.6);
      /* The results dock lifts off the viewport rather than floating over
         the page, so it gets its own lighter value. Both are tokens: a
         shadow that is not one of these two is decoration. */
      --shadow-dock:0 -2px 12px rgba(0,0,0,.25);

      /* Muted teal for the inlet glyph, SimScale's flow-in convention. Kept
         desaturated so it stays a semantic marker rather than a second accent. */
      --tint-inlet:#3f9d94;
    }

    /* The light theme, matching src/styles.css value for value. Not the dark
       set inverted: on a light ground the dark accent scores 3.20 and the dark
       status colours score under 2.3, so each has its own value here, checked
       on a light panel. */
    @media (prefers-color-scheme: light) {
      :root:not([data-theme="dark"]) {
        --bg:#f4f2ee; --panel:#fbfaf7; --panel-2:#eae7e0; --inset:#edeae4;
        --rule:#d6d1c7; --rule-strong:#b9b2a4;
        --ink:#24211d; --ink-2:#4a453d; --ink-3:#6f6961;
        --accent:#1f5fa8; --accent-hi:#0f6b7d; --accent-wash:rgba(31,95,168,0.09);
        --accent-strong:#18568f; --on-accent:#ffffff; --ink-4:#6f6961;
        --scrim:rgba(40,34,24,0.38);
      --accent-strong:#18568f; --on-accent:#ffffff; --ink-4:#6f6961;
      --scrim:rgba(40,34,24,0.38);
        --ok:#15703f; --warn:#7a5600; --bad:#b3261e;
        --tint-inlet:#0f6b7d;
        --shadow-card:0 24px 60px rgba(40,34,24,0.18);
        --shadow-dock:0 -2px 12px rgba(40,34,24,0.12);
      }
    }
    :root[data-theme="light"] {
      --bg:#f4f2ee; --panel:#fbfaf7; --panel-2:#eae7e0; --inset:#edeae4;
      --rule:#d6d1c7; --rule-strong:#b9b2a4;
      --ink:#24211d; --ink-2:#4a453d; --ink-3:#6f6961;
      --accent:#1f5fa8; --accent-hi:#0f6b7d; --accent-wash:rgba(31,95,168,0.09);
      --ok:#15703f; --warn:#7a5600; --bad:#b3261e;
      --tint-inlet:#0f6b7d;
      --shadow-card:0 24px 60px rgba(40,34,24,0.18);
      --shadow-dock:0 -2px 12px rgba(40,34,24,0.12);
    }
    * { box-sizing:border-box; }
    html, body { height:100%; }
    body {
      margin:0; background:var(--bg); color:var(--ink);
      font:13px/1.45 var(--font);
      -webkit-font-smoothing:antialiased; letter-spacing:-0.005em;
      /* The app's .main-grid ground, so the two halves share a surface. It
         only shows through the sign-in gate and behind translucent panels; the
         viewport and the docked panes sit on solid fills above it. Flat: a dot
         grid is banned by the design rules, and it read as texture for its own
         sake rather than as anything a user could act on. */
    }
    .hidden { display:none !important; }
    .muted { color:var(--ink-2); }
    .num   { font-family:var(--mono); font-variant-numeric:tabular-nums; font-size:12px; }
    .eyebrow {
      font-size:10px; font-weight:600; letter-spacing:.08em; text-transform:uppercase;
      color:var(--ink-3);
    }

    /* ── shell ── */
    .app { display:flex; flex-direction:column; height:100%; }
    .topbar {
      display:flex; align-items:center; gap:var(--s4); height:38px; flex:0 0 38px;
      padding:0 var(--s3); background:var(--panel); border-bottom:1px solid var(--rule);
    }
    .brand { display:flex; align-items:baseline; gap:var(--s2); }
    .brand b { font-size:13px; font-weight:650; letter-spacing:-0.01em; }
    .brand span { font-size:11px; color:var(--ink-3); }
    .spacer { flex:1; }
    .workspace { flex:1; display:flex; min-height:0; }
    /* 246, not 236: "Simulation control" needed 105px of label and had 99. The
       label is SimScale's own name for that node, so the panel gives way rather
       than the wording. */
    aside.left  { width:266px; flex:0 0 266px; border-right:1px solid var(--rule); }
    aside.right { width:272px; flex:0 0 272px; border-left:1px solid var(--rule); }
    aside { background:var(--panel); display:flex; flex-direction:column; min-height:0; }
    aside .body { overflow-y:auto; flex:1; padding-bottom:var(--s3); }
    .pane-head {
      display:flex; align-items:center; justify-content:space-between;
      padding:var(--s3) var(--s3) var(--s2);
    }
    main { flex:1; display:flex; flex-direction:column; min-width:0; }

    /* ── ribbon ── */
    .ribbon {
      display:flex; align-items:stretch; height:56px; flex:0 0 56px;
      padding:0 var(--s2); background:var(--panel);
      border-bottom:1px solid var(--rule); overflow-x:auto; overflow-y:hidden;
    }
    .rgroup { display:flex; flex-direction:column; padding:0 var(--s2); flex:0 0 auto; }
    .rgroup + .rgroup { border-left:1px solid var(--rule); }
    .rgroup-row { display:flex; gap:1px; flex:1; align-items:flex-start; padding-top:2px; }
    .rgroup-label {
      text-align:center; font-size:9px; font-weight:600; letter-spacing:.07em;
      text-transform:uppercase; color:var(--ink-3); padding-bottom:3px;
    }
    .rbtn {
      display:flex; flex-direction:column; align-items:center; gap:3px;
      min-width:52px; padding:3px 6px 2px; border:1px solid transparent;
      border-radius:var(--r1); background:none; color:var(--ink-2);
      font:inherit; font-size:10px; line-height:1.1; white-space:nowrap;
    }
    .rbtn:hover:not(:disabled) { background:var(--panel-2); color:var(--ink); }
    .rbtn[aria-pressed="true"] { background:var(--accent-wash); border-color:var(--accent-wash); color:var(--accent-hi); }
    .rbtn:disabled { opacity:.3; cursor:default; }
    .rbtn:focus-visible { outline:1px solid var(--accent); outline-offset:1px; }
    /* 1.7px, not 1.4 — a 16px glyph at hairline weight reads as smudge next to
       10px label text, and the ribbon is the first thing anyone looks at. */
    .rbtn svg {
      width:16px; height:16px; stroke:currentColor; fill:none;
      stroke-width:1.7; stroke-linecap:round; stroke-linejoin:round;
    }
    .rbtn { color:var(--ink-2); }
    .rbtn:hover:not(:disabled) svg { stroke-width:1.9; }

    /* ── viewport ── */
    .viewport {
      position:relative; flex:1; min-height:0; margin:var(--s2) var(--s2) 0;
      background:var(--bg);
      border:1px solid var(--rule); border-radius:var(--r3) var(--r3) 0 0; overflow:hidden;
    }
    .viewport canvas { position:absolute; inset:0; width:100%; height:100%; display:block; }
    .viewport-hint {
      position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
      pointer-events:none; color:var(--ink-3); font-size:12px;
    }

    /* ── cards & rows ── */
        /* The app's .card-elegant: a soft vertical wash rather than a flat fill,
       over a hairline that is lighter than the structural rules. */
    .card {
      background:var(--inset);
      border:1px solid var(--rule); border-radius:var(--r2);
    }
    /* Sizes to its content — no minimum. A fixed floor looked generous with
       eight runs and left ninety pixels of nothing under a simulation that has
       two, which is the more common case. */
    .runs {
      margin:0 var(--s2) var(--s2); overflow:hidden;
      border-radius:0 0 var(--r3) var(--r3); border-top:0; flex:0 0 auto;
    }
    /* 10 x 24px rows. 238 was 9.92 rows, so a full list always ended on a row
       sliced at 90% — which reads as a rendering fault, not a scroll hint. */
    .runs-body { max-height:240px; overflow-y:auto; }

    /* Run rows are a table, so the numbers form columns you can read down.
       Fixed trailing columns; only the name flexes and truncates. */
    .row {
      display:flex; align-items:center; gap:var(--s2); width:100%;
      padding:0 var(--s3); height:24px;
      border:0; background:none; color:inherit; text-align:left;
      font:inherit; cursor:pointer; border-left:2px solid transparent;
    }
    .row:hover { background:var(--panel-2); }
    .row:focus-visible { outline:1px solid var(--accent); outline-offset:-1px; }
    .row.sel  { background:var(--accent-wash); border-left-color:var(--accent); }
    .row .grow { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .row .c-tag  { flex:0 0 84px; }
    .row .c-drag { flex:0 0 62px; text-align:right; }
    .row .c-date { flex:0 0 48px; text-align:right; color:var(--ink-3); }
    .row.child { padding-left:var(--s5); color:var(--ink-2); }
    .row.child.sel { color:var(--ink); }
    /* The 2px transparent left border matches .row's selection marker: without it
       every figure sat 2px right of the column header naming it. Height matches
       the 24px row module so the header shares the rows' grid. */
    .runs-head {
      display:flex; align-items:center; gap:var(--s2); padding:0 var(--s3); height:24px;
      border-left:2px solid transparent;
      border-bottom:1px solid var(--rule); color:var(--ink-3);
      font-size:10px; font-weight:600; letter-spacing:.06em; text-transform:uppercase;
    }
    .runs-head .grow { flex:1; }
    .group-label {
      display:flex; align-items:center; gap:var(--s2);
      padding:var(--s3) var(--s3) var(--s1); font-weight:600; font-size:12px;
    }
    /* Expander triangle. A rotated glyph rather than two icons, so the open and
       closed states cannot drift apart. */
    .twist {
      flex:0 0 10px; width:10px; height:10px; margin-right:2px; border:0; padding:0;
      background:none; color:var(--ink-3); cursor:pointer; line-height:0;
    }
    .twist svg { width:10px; height:10px; fill:currentColor; transition:transform .12s ease; }
    .twist[aria-expanded="false"] svg { transform:rotate(-90deg); }
    .twist:hover { color:var(--ink); }
    /* Section state dot. Green once a section has everything the solver needs,
       amber when it is using a default that ought to be looked at. */
    .dot {
      flex:0 0 6px; width:6px; height:6px; border-radius:50%; display:inline-block;
    }
    .dot-ok   { background:var(--ok); }
    .dot-warn { background:var(--warn); }
    .dot-bad  { background:var(--bad); }
    /* No state, no dot. A grey dot on eleven of fifteen rows is noise that
       teaches the eye to ignore the four that mean something. The slot stays
       reserved so labels still line up. */
    .dot-none { background:transparent; }
    /* Semantic node glyphs. The shape says what kind of node it is (inlet, wall,
       mesh, run…) so the tree reads at a glance; the dot beside it still carries
       live status. Colour is spent only where it is itself information — teal
       flow-in at the inlet, amber flow-out at the outlet — everything structural
       stays neutral. */
    .tnode-ic { flex:0 0 14px; width:14px; height:14px; line-height:0; margin-left:-2px; color:var(--ink-2); }
    .tnode-ic svg {
      width:14px; height:14px; stroke:currentColor; fill:none;
      stroke-width:1.4; stroke-linecap:round; stroke-linejoin:round; display:block;
    }
    .empty { padding:var(--s2) var(--s3); color:var(--ink-3); font-size:12px; }
    /* First-run state: an empty tree used to just say "No projects yet", leaving
       a signed-in user staring at a dead workbench with no usable path. This
       offers a working sample so every tool can be tried immediately. */
    .firstrun { padding:var(--s4) var(--s3); }
    .firstrun-lead { margin:0 0 var(--s1); font-size:13px; font-weight:600; color:var(--ink); }
    .firstrun-sub { margin:0 0 var(--s3); font-size:12px; line-height:1.5; color:var(--ink-2); }
    .firstrun-note { margin:var(--s3) 0 0; font-size:11px; line-height:1.5; color:var(--ink-3); }
    .firstrun-note b { color:var(--ink-2); font-weight:600; }

    /* ── tabs ── */
    .tabs { display:flex; gap:0; padding:0 var(--s2); border-bottom:1px solid var(--rule); background:var(--panel); }
    .tab {
      padding:6px var(--s3) 5px; background:none; border:0; border-bottom:2px solid transparent;
      color:var(--ink-3); font:inherit; font-size:12px; font-weight:500;
    }
    .tab:hover { color:var(--ink-2); }
    .tab.sel  { color:var(--ink); border-bottom-color:var(--accent); }

    /* ── charts ── */
    .chart-pane { padding:var(--s3); }
    .chart { display:block; width:100%; height:160px; overflow:visible; }
    .chart .grid  { stroke:var(--rule); stroke-width:1; }
    .chart .axis  { fill:var(--ink-3); font-size:9px; font-family:var(--mono); }
    .chart path   { fill:none; stroke-width:1.5; stroke-linejoin:round; stroke-linecap:round; }
    .chart-legend { display:flex; flex-wrap:wrap; gap:var(--s3); margin-top:var(--s2); font-size:11px; }
    /* The swatch had gap:5px AND margin-right:5px, putting it 10px from its own
       label while entries sat 12px apart — so each swatch grouped with the wrong
       name. vertical-align was dead too: flex items ignore it. */
    .chart-legend span { display:inline-flex; align-items:center; gap:var(--s2); color:var(--ink-2); }
    .swatch { display:inline-block; width:10px; height:2px; border-radius:0; flex:0 0 10px; }

    /* ── comparison table ── */
    table.cmp { width:100%; border-collapse:collapse; margin-bottom:var(--s3); }
    table.cmp th, table.cmp td { padding:4px var(--s3); text-align:right; white-space:nowrap; }
    table.cmp thead th { color:var(--ink-2); font-weight:500; border-bottom:1px solid var(--rule); }
    table.cmp tbody th { text-align:left; color:var(--ink-2); font-weight:400; }
    table.cmp tbody tr + tr th, table.cmp tbody tr + tr td { border-top:1px solid var(--rule); }
    .good { color:var(--ok); }
    .bad  { color:var(--bad); }
    input.pick { width:12px; height:12px; flex:0 0 12px; margin:0; accent-color:var(--accent); }

    /* ── geometry / edit panel ── */
    .geo-head { display:flex; align-items:center; gap:var(--s2); margin-bottom:var(--s2); }
    .geo-head .grow { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .ver {
      font-family:var(--mono); font-size:10px; padding:0 4px; border-radius:var(--r1);
      background:var(--panel-2); border:1px solid var(--rule-strong); color:var(--ink-2);
    }
    .edit-grid { display:grid; grid-template-columns:1fr 1fr; gap:0 var(--s2); }
    .edit-grid .field:first-child { grid-column:1 / -1; }

    /* ── status pill ── */
    .tag {
      font-size:9px; font-weight:600; letter-spacing:.04em; text-transform:uppercase;
      padding:1px 5px; border-radius:var(--r1); border:1px solid currentColor; white-space:nowrap;
      display:inline-block;
    }
    .tag::before {
      content:""; display:inline-block; width:4px; height:4px; border-radius:50%;
      background:currentColor; margin-right:4px; vertical-align:1px;
    }
    .t-complete  { color:var(--ok); }
    .t-failed    { color:var(--bad); }
    .t-cancelled { color:var(--ink-3); }
    .t-running, .t-meshing, .t-pending, .t-queued, .t-downloading,
    .t-uploading_geometry, .t-processing, .t-creating_simulation, .t-cancelling {
      color:var(--warn);
    }
    .t-running::before, .t-meshing::before, .t-pending::before, .t-queued::before,
    .t-downloading::before, .t-processing::before, .t-creating_simulation::before,
    .t-cancelling::before {
      animation:pulse 1.8s ease-in-out infinite;
    }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.25} }

    /* ── controls ── */
    button { font:inherit; cursor:pointer; }
    .btn {
      display:inline-flex; align-items:center; gap:5px; height:24px; padding:0 var(--s2);
      background:var(--panel-2); color:var(--ink);
      border:1px solid var(--rule-strong); border-radius:var(--r1);
      transition:background .1s ease, border-color .1s ease;
    }
    .btn:hover { background:var(--rule-strong); border-color:var(--rule); }
    .btn:active { background:var(--inset); }
    /* .rbtn and .row both ring on focus; .btn was the one interactive element
       that did not, so tabbing through the topbar, the sign-in card or a modal
       showed nothing at all. Matches the input treatment rather than inventing
       a third focus style. */
    .btn:focus-visible {
      outline:2px solid var(--accent-wash); outline-offset:0; border-color:var(--accent);
    }
        /* The app's .btn-primary gradient and border, at Workbench scale. */
    .btn-primary {
      background:var(--accent);
      border:1px solid var(--accent-wash); color:var(--on-accent); font-weight:600;
    }
    .btn-primary:hover { background:var(--accent-strong); }
    .btn-primary:disabled { opacity:.4; cursor:default; }
    .btn-block { width:100%; justify-content:center; }
        /* The app's .input-field, at Workbench height. */
    input, select {
      width:100%; height:24px; padding:0 var(--s2); color:var(--ink);

    .legendbar {

      height:9px; width:200px; border-radius:0; border:1px solid var(--rule-strong);

      background:linear-gradient(90deg,#440154,#48186a,#3f4788,#345d8d,#2a768e,
                                        #218e8d,#28ae7f,#5ec962,#addc30,#fde725);

    /* Interior ticks only. The ends of the scale are already the two editable
       inputs either side of the bar — printing them again underneath said the
       same number twice and left the quartiles competing with the endpoints for
       attention. Positioned rather than space-between, so the label sits over
       the value it marks whatever set of ticks is drawn. */
    .legend-wrap { position:relative; width:200px; }

    }

    /* ── job status panel ── */
    .jobstatus { flex:0 0 auto; border-top:1px solid var(--rule); padding:var(--s2) var(--s3); }

      height:3px; background:var(--inset); border-radius:var(--r1); margin:6px 0; overflow:hidden;

       These carry a third of the panel height on Mesh, Result control, Wheels
       and Analysis type. For a school team they are the point — they say what
       each number means. But someone who already knows should be able to put
       them away and have that stick, so they collapse and the choice persists.
       Default is ON: the reader who needs them will not go looking. */
    .panel-note {
      margin:var(--s2) 0 var(--s3); padding-left:var(--s2);
      border-left:1px solid var(--rule-strong);

    .note-toggle {
      height:18px; padding:0 6px; font-size:10px; font-weight:600;

      background:none; border:1px solid var(--rule-strong); border-radius:var(--r1);

    .prep {

    .navpanel {

    /* ── statistics panel ── */
    .stats {
      position:absolute; right:var(--s3); bottom:var(--s3); width:222px; padding:var(--s3);
      background:var(--panel); border:1px solid var(--rule); border-radius:var(--r3);
      box-shadow:var(--shadow-card);
    }
    .stats dl { display:grid; grid-template-columns:auto 1fr; gap:3px var(--s3); margin:var(--s2) 0 0; }

    .stats dd { margin:0; text-align:right; }
    .stats .note { margin:var(--s2) 0 0; font-size:11px; color:var(--ink-3); }

    /* ── results readout ──
       Hard width cap. Unwrapped explanatory lines were stretching this card to
       623px — 54% of the viewport, sitting exactly on top of the car. A result
       panel that hides the result is worse than no panel. */
    .readout {
      /* Floats clear of the left tree panel (246px + gaps) so both read as
         separate cards on the scene rather than stacking on the same corner. */
      position:absolute; left:calc(266px + var(--s2) + var(--s3)); top:calc(var(--s2) + 66px);

    .readout .caveat {

    .gate { height:100%; display:grid; place-items:center; }
    .gate .card { width:320px; padding:var(--s6); text-align:center; }
    .gate h1 { margin:0 0 6px; font-size:16px; font-weight:650; letter-spacing:-0.015em; }
    .gate p { margin:0 0 var(--s5); color:var(--ink-2); }
    /* ── boot splash ── Covers the gap between load and a decided session. The

    .boot {
      position:fixed; inset:0; z-index:70; background:var(--bg);
      display:flex; flex-direction:column; align-items:center; justify-content:center; gap:var(--s3);
    }

    .gate-or::before, .gate-or::after { content:""; flex:1; height:1px; background:var(--rule); }

    .toast {

    .modal-back { position:fixed; inset:0; background:var(--scrim); display:grid; place-items:center; z-index:60; }
    .modal { width:340px; padding:var(--s4); }
    .modal h2 { margin:0 0 var(--s2); font-size:13px; font-weight:650; letter-spacing:-0.01em; }

    .modal-row .btn { width:auto; padding:0 var(--s3); }
    /* Stale-build chip. Sits in the topbar, does nothing until the file on the
       server is newer than the one this tab loaded. */
    .stale {
      display:inline-flex; align-items:center; gap:6px; height:22px; padding:0 var(--s2);
      background:var(--accent-wash); border:1px solid var(--accent-wash); border-radius:var(--r1);
      color:var(--accent-hi); font-size:11px; cursor:pointer;
    }
    .stale:hover { background:var(--rule-strong); }
    .stale::before {
      content:""; width:5px; height:5px; border-radius:50%; background:var(--accent-hi);
      animation:pulse 1.8s ease-in-out infinite;
    }
    /* One interaction model, applied to every surface control rather than the
       three it happened to reach before. .tab, .twist, .note-toggle and .stale

    :where(.tab, .twist, .note-toggle, .stale):focus-visible {

       on a slow field fetch is several hundred ms of "did that register?". */
    .rbtn:active:not(:disabled), .tab:active, .note-toggle:active { background:var(--inset); }

    @media (prefers-reduced-motion:reduce) {

    ::-webkit-scrollbar-thumb:hover { background:var(--ink-3); }
    ::-webkit-scrollbar-track { background:transparent; }

    /* ── 3D-first layout ──────────────────────────────────────────────────────

       continuous scene, and every panel FLOATS on top of it as a card rather
       than dividing the window into columns. */

    .viewport {

      border-radius:var(--r3); overflow:hidden;

       reclaims its vertical space, so the 3D scene runs unbroken beneath it. */

    .ribbon {

    aside.right { right:var(--s2); border:1px solid var(--rule); border-left:1px solid var(--rule); }

    .dock-bottom {

      left:calc(266px + var(--s2) * 2);

      margin:0; border:1px solid var(--rule); border-radius:0 0 var(--r3) var(--r3);
      box-shadow:var(--shadow-card);
    }

    .dock-bottom #post.hidden + .runs { border-radius:var(--r3); }

  <script>

          <svg viewBox="0 0 16 16"><path d="M13.5 8a5.5 5.5 0 1 1-1.6-3.9"/><path d="M13.5 1.8v2.7h-2.7"/></svg>
          Reset</button>
      </div>
      <div class="rgroup-label">Result</div>
    </div>
  </nav>

  <div class="workspace">
    <aside class="left">
      <div id="tree" class="body"></div>
      <!-- Job status, bottom-left like SimScale's. Progress is the position in
           the real status sequence the worker walks, not an animation. -->
      <div id="jobstatus" class="jobstatus hidden"></div>
    </aside>

    <main>
      <section class="viewport">
        <canvas id="canvas"></canvas>
        <div id="viewer"></div>
        <div id="viewerHint" class="viewport-hint">
          <p>Select a simulation to view its geometry.</p>
        </div>

        <!-- Cutting-plane control appears when the ribbon toggles it on. -->
        <div id="clipCtl" class="card hidden" style="position:absolute;left:var(--s4);bottom:var(--s4);
             display:flex;align-items:center;gap:var(--s2);padding:var(--s2) var(--s3)">
          <span class="eyebrow">Cut</span>
          <select id="clipAxis" style="width:60px" onchange="applyClip()" aria-label="Cutting plane axis">
            <option value="">Off</option><option value="x">X</option><option value="y">Y</option><option value="z">Z</option>
          </select>
          <input id="clipT" type="range" min="0" max="1" step="0.01" value="1" style="width:120px" oninput="applyClip()" aria-label="Cutting plane position">
        </div>

        <!-- Field statistics, toggled from the ribbon. Real numbers from the
             field buffer on screen, labelled with exactly what they are. -->

        <select id="cmapSel" style="min-width:104px" onchange="applyColourMap()" title="Colour map">
          <option value="viridis">Viridis</option>

                title="Quantise the scale into contour bands to show where the gradient is">
          <option value="0">Smooth</option>

        <span id="inspTitle" class="eyebrow">Simulation setup</span>
        <span style="display:flex;align-items:center;gap:var(--s2)">
          <span id="inspDirty" class="num muted"></span>
          <button id="noteToggle" class="note-toggle" aria-pressed="true"
                  onclick="toggleNotes()" title="Show or hide the explanations">Notes</button>
        </span>
      </div>

  <div id="toast" class="card toast hidden" role="status" aria-live="polite"></div>
</div>

<input id="stepInput"  type="file" accept=".step,.stp" class="hidden" />
<input id="labelInput" type="file" accept=".csv"       class="hidden" />

<!-- 3D viewer. The .glb comes from the tessellation service (OCC), because a
     browser cannot triangulate a STEP file on its own. -->
<script type="module">
import * as THREE from "three";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";
import { createViewCube } from "./wb-viewcube.js";

const canvas = document.getElementById("canvas");
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(45, 1, 0.001, 5000);
const controls = new OrbitControls(camera, canvas);

// ── navigation ───────────────────────────────────────────────────────────────
// Damping was on, which is why the viewport felt like it was floating: the
// camera kept moving after the mouse stopped and every drag ended in a glide.
// A CAD viewer should stop when the hand stops. SimScale's does, and so does
// Fusion. Off by default, and a preference for anyone who wants it back.
//
// The button assignments are a preference too, because every CAD package
// picks different ones and muscle memory does not transfer. The presets are
// the real bindings from each, not an invention:
//
//   SimScale    rotate left, pan middle or ctrl+left, zoom right or wheel
//   Fusion 360  pan middle, rotate shift+middle, zoom wheel
//   Onshape     rotate right, pan ctrl+right, zoom wheel
//
// three's OrbitControls maps one action per physical button, so the modifier
// variants are handled in the pointer handler below rather than here.
const NAV_PRESETS = {
  simscale: {
    label: "SimScale",
    buttons: { LEFT: THREE.MOUSE.ROTATE, MIDDLE: THREE.MOUSE.PAN, RIGHT: THREE.MOUSE.DOLLY },
    ctrlLeft: "PAN", altLeft: "DOLLY",
  },
  fusion: {
    label: "Fusion 360",
    buttons: { LEFT: THREE.MOUSE.ROTATE, MIDDLE: THREE.MOUSE.PAN, RIGHT: THREE.MOUSE.PAN },
    ctrlLeft: "PAN", altLeft: null,
  },
  onshape: {
    label: "Onshape",
    buttons: { LEFT: THREE.MOUSE.ROTATE, MIDDLE: THREE.MOUSE.PAN, RIGHT: THREE.MOUSE.ROTATE },
    ctrlLeft: "PAN", altLeft: null,
  },
};

const NAV_DEFAULTS = { preset: "simscale", damping: false, invertZoom: false, speed: 1 };
let nav = { ...NAV_DEFAULTS };
try {
  nav = { ...NAV_DEFAULTS, ...JSON.parse(localStorage.getItem("turboflow-nav") || "{}") };
} catch (e) { /* first run, or storage refused */ }

function applyNav() {
  const preset = NAV_PRESETS[nav.preset] || NAV_PRESETS.simscale;
  controls.mouseButtons = { ...preset.buttons };
  controls.enableDamping = !!nav.damping;
  controls.dampingFactor = 0.12;
  // Direct rather than languid. The defaults are tuned for orbiting a scene,
  // not for inspecting a part you are about to pay to solve.
  controls.rotateSpeed = 0.9 * nav.speed;
  controls.panSpeed = 1.0 * nav.speed;
  controls.zoomSpeed = (nav.invertZoom ? -1 : 1) * 1.2 * nav.speed;
  controls.zoomToCursor = true;
  controls.screenSpacePanning = true;
  controls.update();
}
applyNav();

window.navSettings = () => ({ ...nav, presets: Object.entries(NAV_PRESETS).map(([k, v]) => [k, v.label]) });
window.setNav = (patch) => {
  nav = { ...nav, ...patch };
  try { localStorage.setItem("turboflow-nav", JSON.stringify(nav)); } catch (e) {}
  applyNav();
  return { ...nav };
};

// Modifier variants, which OrbitControls cannot express on its own. Swapping
// the left button's job before the control sees the event is what lets
// ctrl+left pan and alt+left zoom the way every CAD package does it.
canvas.addEventListener("pointerdown", (ev) => {
  if (ev.button !== 0) return;
  const preset = NAV_PRESETS[nav.preset] || NAV_PRESETS.simscale;
  const want = ev.ctrlKey || ev.metaKey ? preset.ctrlLeft : ev.altKey ? preset.altLeft : null;
  controls.mouseButtons.LEFT = want ? THREE.MOUSE[want] : preset.buttons.LEFT;
}, true);
canvas.addEventListener("pointerup", () => {
  const preset = NAV_PRESETS[nav.preset] || NAV_PRESETS.simscale;
  controls.mouseButtons.LEFT = preset.buttons.LEFT;
});

// Right-drag to zoom means the browser menu has to stay out of the way.
canvas.addEventListener("contextmenu", (ev) => ev.preventDefault());
// Studio lighting for a white ground: bright sky, warm-grey bounce off the
// "floor" rather than near-black. On a dark background the old ground colour
// read as shadow; on paper it reads as a hole under the car.
scene.add(new THREE.HemisphereLight(0xffffff, 0xd6d4ce, 1.35));
const key = new THREE.DirectionalLight(0xffffff, 0.9); key.position.set(2, 3, 4); scene.add(key);
const fill = new THREE.DirectionalLight(0xffffff, 0.35); fill.position.set(-3, -2, 1); scene.add(fill);
let current = null;

function resize() {
  const r = canvas.getBoundingClientRect();
  if (!r.width || !r.height) return;
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.setSize(r.width, r.height, false);
  camera.aspect = r.width / r.height; camera.updateProjectionMatrix();
}
addEventListener("resize", resize);
const viewCube = createViewCube({
  camera, controls, container: canvas.parentElement, size: 92,
});
window.viewCube = viewCube;
// Draw when something changed, not sixty times a second regardless. A viewer
// that repaints an idle scene forever keeps a laptop fan running through a
// meeting, and on a machine already busy it is what makes a drag feel late:
// the frame you are waiting for is queued behind frames nobody asked for.
let needsDraw = true;
window.requestDraw = () => { needsDraw = true; };
controls.addEventListener("change", window.requestDraw);
addEventListener("resize", window.requestDraw);

(function loop() {
  requestAnimationFrame(loop);
  resize();
  // Damping keeps moving after the input stops, so while it is on the loop has
  // to keep asking whether it has settled.
  if (controls.enableDamping) { controls.update(); needsDraw = true; }
  if (!needsDraw) return;
  needsDraw = false;
  controls.update();
  renderer.render(scene, camera);
  viewCube.update();                  // drawn after, into its own canvas
})();

// ── field colouring ──────────────────────────────────────────────────────────
// Fields arrive as a raw Float32Array, one value per vertex, separate from the
// glb (see export_results_for_viewer in the worker). That means switching field
// re-uploads one attribute instead of refetching geometry, and the colour map is
// evaluated in the fragment shader rather than baked into vertex colours.
const CLIP = new THREE.Plane(new THREE.Vector3(-1, 0, 0), Infinity);
renderer.localClippingEnabled = true;

// Viridis, sampled. Perceptually uniform and readable for anyone colour-blind,
// which rainbow — the CFD default — is not.
const VIRIDIS = [
  [0.267,0.005,0.329],[0.283,0.141,0.458],[0.254,0.265,0.530],[0.207,0.372,0.553],
  [0.164,0.471,0.558],[0.128,0.567,0.551],[0.135,0.659,0.518],[0.267,0.749,0.441],
  [0.478,0.821,0.318],[0.741,0.873,0.150],[0.993,0.906,0.144]];

// Rainbow is kept because it is what every CFD tool defaults to and reviewers
// expect to see it, not because it is a good colour map — it invents banding
// that is not in the data. Coolwarm is the right choice for anything centred on
// zero, like a pressure coefficient.
const COLOUR_MAPS = {
  viridis: VIRIDIS,
  coolwarm: [
    [0.230,0.299,0.754],[0.406,0.537,0.934],[0.603,0.731,0.999],[0.788,0.855,0.937],
    [0.932,0.900,0.858],[0.968,0.800,0.700],[0.958,0.647,0.525],[0.900,0.474,0.365],
    [0.800,0.303,0.240],[0.706,0.016,0.150],[0.706,0.016,0.150]],
  rainbow: [
    [0.000,0.000,0.500],[0.000,0.000,1.000],[0.000,0.500,1.000],[0.000,1.000,1.000],
    [0.300,1.000,0.700],[0.700,1.000,0.300],[1.000,1.000,0.000],[1.000,0.700,0.000],
    [1.000,0.300,0.000],[0.800,0.000,0.000],[0.500,0.000,0.000]],
  greyscale: Array.from({ length: 11 }, (_, i) => [i / 10, i / 10, i / 10]),
};
let activeMap = "viridis";

function fieldMaterial() {
  return new THREE.ShaderMaterial({
    clippingPlanes: [CLIP], clipping: true, side: THREE.DoubleSide,
    uniforms: {
      uMin: { value: 0 }, uMax: { value: 1 }, uHasField: { value: 0 },
      uRamp: { value: COLOUR_MAPS[activeMap].flatMap((c) => c) },
      uWire: { value: 0 },
      uBands: { value: 0 },        // 0 = continuous ramp
      uSelFace: { value: -1 },     // highlighted face group, -1 = none
      uLight: { value: new THREE.Vector3(0.4, 0.7, 0.6).normalize() },
    },
    vertexShader: `
      attribute float aField;
      attribute float aFace;
      // Which faces the user has marked as a wheel. A per-vertex flag rather
      // than a uniform list, because a wheel can be a dozen trimmed faces and
      // the list would have to be sized for the worst car anyone ever uploads.
      attribute float aPick;
      varying float vT; varying vec3 vN; varying float vFace; varying float vPick;
      uniform float uMin, uMax;
      #include <clipping_planes_pars_vertex>
      void main() {
        vT = clamp((aField - uMin) / max(uMax - uMin, 1e-9), 0.0, 1.0);
        vN = normalize(normalMatrix * normal);
        vFace = aFace;
        vPick = aPick;
        // Must be named mvPosition: <clipping_planes_vertex> is a three.js
        // chunk that expands to "vClipPosition = -mvPosition.xyz" and expects
        // that exact identifier in scope. Calling it anything else fails to
        // compile the whole vertex shader: three then swaps in its error
        // material and the surface silently stops drawing, so field colouring
        // and the cutting plane never render and only the console says why.
        vec4 mvPosition = modelViewMatrix * vec4(position, 1.0);
        #include <clipping_planes_vertex>
        gl_Position = projectionMatrix * mvPosition;
      }`,
    fragmentShader: `
      precision highp float;
      varying float vT; varying vec3 vN; varying float vFace; varying float vPick;
      uniform float uRamp[33]; uniform float uHasField; uniform vec3 uLight;
      uniform float uBands; uniform float uSelFace;
      #include <clipping_planes_pars_fragment>
      vec3 ramp(float t) {
        float x = t * 10.0; int i = int(floor(x)); float f = fract(x);
        if (i > 9) { i = 9; f = 1.0; }
        vec3 a = vec3(uRamp[i*3], uRamp[i*3+1], uRamp[i*3+2]);
        vec3 b = vec3(uRamp[i*3+3], uRamp[i*3+4], uRamp[i*3+5]);
        return mix(a, b, f);
      }
      void main() {
        #include <clipping_planes_fragment>
        // Contour bands. A continuous ramp shows the value everywhere and the
        // GRADIENT nowhere. Quantising to N steps turns the rate of change
        // into visible contour lines, which is where separation and stagnation
        // show up. Sampling each band's centre keeps the colours the ones on
        // the legend rather than the boundaries between them.
        float t = vT;
        if (uBands > 0.5) t = (floor(vT * uBands) + 0.5) / uBands;
        // Unfielded geometry is a mid neutral grey: dark enough to read as a
        // solid, neutral enough not to be mistaken for a field value.
        vec3 base = uHasField > 0.5 ? ramp(t) : vec3(0.58, 0.59, 0.62);
        float lambert = 0.45 + 0.55 * max(dot(normalize(vN), uLight), 0.0);
        vec3 lit = base * lambert;
        // Selected face group. Tinted toward the accent rather than replaced,
        // so the field is still readable underneath, you need to see WHICH
        // face you picked and what the pressure on it is at the same time.
        if (uSelFace >= 0.0 && abs(vFace - uSelFace) < 0.5) {
          lit = mix(lit, vec3(0.231, 0.510, 0.965), 0.45);
        }
        // A marked wheel face. Amber, not the accent, so it cannot be confused
        // with the single face under the pointer.
        if (vPick > 0.5) lit = mix(lit, vec3(1.0, 0.784, 0.188), 0.55);
        gl_FragColor = vec4(lit, 1.0);
      }`,
  });
}

let meshes = [], bounds = null;

// Distance at which the model's bounding sphere just fills the frame.
// Hand-picked multipliers were leaving the car at about a quarter of the
// viewport — fine for a cube, wrong for a body that is three times longer than
// it is tall. The binding constraint is whichever field of view is narrower:
// on a wide viewport that is the vertical one, on a tall one the horizontal.
function fitDistance(size) {
  const r = 0.5 * Math.hypot(size.x, size.y, size.z);
  const vFov = (camera.fov * Math.PI) / 180;
  const hFov = 2 * Math.atan(Math.tan(vFov / 2) * (camera.aspect || 1));
  return (r / Math.sin(Math.min(vFov, hFov) / 2)) * 1.08;   // 8% breathing room
}

function frame(model) {
  const box = new THREE.Box3().setFromObject(model);
  const size = box.getSize(new THREE.Vector3()), centre = box.getCenter(new THREE.Vector3());
  model.position.sub(centre);
  const span = Math.max(size.x, size.y, size.z) || 1;
  const dist = fitDistance(size);
  camera.position.copy(new THREE.Vector3(...VIEWS.iso).normalize().multiplyScalar(dist));
  camera.up.set(0, 0, 1);
  camera.near = dist / 200; camera.far = dist * 50; camera.updateProjectionMatrix();
  controls.target.set(0, 0, 0); controls.update();
  bounds = { span, dist, min: box.min.clone().sub(centre), max: box.max.clone().sub(centre) };
  CLIP.constant = Infinity;
  window.dispatchEvent(new CustomEvent("model-bounds", { detail: bounds }));
}

// Frame the model however big the car happens to be — chord lengths vary.
window.renderGlb = async function (url) {
  if (current) { scene.remove(current); current.traverse?.((o) => { o.geometry?.dispose?.(); o.material?.dispose?.(); }); current = null; }
  meshes = [];
  document.getElementById("viewerHint").classList.toggle("hidden", !!url);
  if (!url) return;
  const gltf = await new GLTFLoader().loadAsync(url);
  const model = gltf.scene;
  model.traverse((o) => {
    if (!o.isMesh) return;
    o.geometry.computeVertexNormals();
    // _FACEID is what the tessellation service emits per vertex, naming the
    // B-rep face each triangle came from.
    //
    // GLTFLoader lowercases any attribute it does not have a mapping for, so
    // `_FACEID` in the file arrives as `_faceid` on the geometry. Look for both
    // rather than betting on one: the exporter's spelling and the loader's are
    // not the same string, and getting it wrong fails silently — every vertex
    // reads face 0 and picking appears to work while selecting nothing.
    const fid = o.geometry.getAttribute("_faceid")
             || o.geometry.getAttribute("_FACEID")
             || Object.entries(o.geometry.attributes)
                  .find(([k]) => k.toLowerCase() === "_faceid")?.[1];
    if (fid) o.geometry.setAttribute("aFace", fid);
    else o.geometry.setAttribute("aFace",
      new THREE.BufferAttribute(new Float32Array(o.geometry.attributes.position.count), 1));
    o.geometry.setAttribute("aPick",
      new THREE.BufferAttribute(new Float32Array(o.geometry.attributes.position.count), 1));
    o.material = fieldMaterial();
    meshes.push(o);
  });
  frame(model);
  scene.add(model); current = model;
};

// Attach a downloaded field to the geometry currently on screen.
window.applyField = function (values, min, max) {
  for (const m of meshes) {
    const n = m.geometry.attributes.position.count;
    if (!values || values.length < n) {
      m.material.uniforms.uHasField.value = 0;
      continue;
    }
    m.geometry.setAttribute("aField", new THREE.BufferAttribute(values.subarray(0, n), 1));
    m.material.uniforms.uMin.value = min;
    m.material.uniforms.uMax.value = max;
    m.material.uniforms.uHasField.value = 1;
  }
};

// Cutting plane: t in [0,1] along an axis, or null to switch it off.
// three keeps the half-space where normal·p + constant > 0, so a normal of -axis
// with constant d keeps everything below d on that axis.
window.setClip = function (axis, t) {
  if (!bounds || t == null) { CLIP.constant = Infinity; return; }
  CLIP.normal.set(axis === "x" ? -1 : 0, axis === "y" ? -1 : 0, axis === "z" ? -1 : 0);
  CLIP.constant = bounds.min[axis] + (bounds.max[axis] - bounds.min[axis]) * t;
};

// Rescale the colour ramp without refetching the field. Clipping the range to
// the interesting band is most of post-processing: a single stagnation point at
// +234 Pa flattens the whole rest of the car to one colour on the auto range.
window.setRange = function (min, max) {
  if (!isFinite(min) || !isFinite(max) || max <= min) return false;
  for (const m of meshes) { m.material.uniforms.uMin.value = min; m.material.uniforms.uMax.value = max; }
  return true;
};

window.setColourMap = function (name) {
  if (!COLOUR_MAPS[name]) return;
  activeMap = name;
  const ramp = COLOUR_MAPS[name].flatMap((c) => c);
  for (const m of meshes) m.material.uniforms.uRamp.value = ramp;
};
window.setBands = function (n) {
  const bands = Math.max(0, Math.round(+n || 0));
  for (const m of meshes) m.material.uniforms.uBands.value = bands;
  return bands;
};

// The legend has to be banded too when the surface is, or the bar promises a
// smooth scale the model does not have. Hard stops at each band edge, with each
// band painted the colour the shader samples — its centre.
window.colourMapCss = function (name, bands) {
  const map = COLOUR_MAPS[name] || VIRIDIS;
  const at = (t) => {
    const x = Math.min(Math.max(t, 0), 1) * (map.length - 1);
    const i = Math.min(Math.floor(x), map.length - 2), f = x - i;
    const c = map[i].map((v, k) => v + (map[i + 1][k] - v) * f);
    return `rgb(${c.map((v) => Math.round(v * 255)).join(",")})`;
  };
  if (!bands) {
    return "linear-gradient(90deg," + map   /* design: data */
      .map((c) => `rgb(${c.map((v) => Math.round(v * 255)).join(",")})`).join(",") + ")";
  }
  const stops = [];
  for (let i = 0; i < bands; i++) {
    const col = at((i + 0.5) / bands);
    stops.push(`${col} ${(i / bands) * 100}%`, `${col} ${((i + 1) / bands) * 100}%`);
  }
  return "linear-gradient(90deg," + stops.join(",") + ")";   /* design: data */
};

window.setWireframe = function (on) {
  for (const m of meshes) { m.material.wireframe = !!on; m.material.needsUpdate = true; }
};

// Standard orthographic-style views. Anyone reading a CFD result wants to look
// at it down the flow axis and from the side, and doing that by dragging is
// imprecise — two runs compared from slightly different angles do not compare.
const VIEWS = {
  iso:   [ 1.6,  0.9,  1.8],
  front: [-2.6,  0.0,  0.0],   // looking downstream, into the oncoming flow
  back:  [ 2.6,  0.0,  0.0],
  side:  [ 0.0, -2.6,  0.0],
  top:   [ 0.0,  0.0,  2.6],
};
// Tell the app the viewer API exists. `type="module"` is deferred, so this
// whole block runs AFTER the classic script below has already called boot() —
// meaning renderGlb/applyField/setClip are undefined during the first render.
// Without this handshake the first paint throws TypeError inside showModel's
// try, becomes a toast, and the viewport stays empty on every cold load.
window.setView = function (name) {
  const v = VIEWS[name] || VIEWS.iso;
  // Same fitted distance the initial framing uses, so switching view never
  // changes how big the car is — only which side of it you are looking at.
  const dist = bounds?.dist || 1;
  camera.position.copy(new THREE.Vector3(...v).normalize().multiplyScalar(dist));
  camera.up.set(0, 0, 1);
  controls.target.set(0, 0, 0); controls.update();
};

// A run is evidence, and evidence gets put in a report. Render at device
// resolution rather than screen size so the image survives being printed.
window.snapshot = function (name) {
  renderer.render(scene, camera);
  const a = document.createElement("a");
  a.href = renderer.domElement.toDataURL("image/png");
  a.download = (name || "turboflow") + ".png";
  a.click();
};

// ── inspect point ────────────────────────────────────────────────────────────
// Read the field value at a point on the surface. The value is taken from the
// nearest vertex of the hit triangle rather than interpolated across it: the
// field buffer is per-vertex (one Float32 per vertex, see the worker's
// export_results_for_viewer), so a vertex value is a number the solver actually
// produced, whereas a barycentric blend is a number nothing produced. For a
// probe whose whole job is "what is the pressure HERE", inventing a value is
// worse than snapping a few tenths of a millimetre.
// ── field statistics ─────────────────────────────────────────────────────────
// Area-weighted, over the visible surface only.
//
// A per-vertex mean is not the mean of the field. Tessellation puts vertices
// where curvature is, so a nose with a tight fillet contributes hundreds of
// vertices over a few square millimetres while a flat deck contributes a
// handful over a large area — an unweighted mean is really "the average of
// wherever the mesher happened to put points". Weighting each triangle by its
// area gives the surface average, which is the number that means something.
//
// Triangles removed by the cutting plane are excluded: the panel describes what
// is on screen, and reporting statistics for geometry just cut away answers a
// question nobody asked.
window.fieldStats = function () {
  if (!meshes.length) return null;
  scene.updateMatrixWorld(true);

  const clipping = isFinite(CLIP.constant);
  const a = new THREE.Vector3(), b = new THREE.Vector3(), c = new THREE.Vector3();
  const ab = new THREE.Vector3(), ac = new THREE.Vector3();
  const centroid = new THREE.Vector3();

  let min = Infinity, max = -Infinity;
  let sumA = 0, sumFA = 0, sumF2A = 0, tris = 0, skipped = 0;

  for (const m of meshes) {
    const g = m.geometry, field = g.getAttribute("aField"), pos = g.getAttribute("position");
    if (!field || !pos) continue;
    const idx = g.getIndex();
    const count = idx ? idx.count : pos.count;
    const at = (k) => (idx ? idx.getX(k) : k);

    for (let t = 0; t + 2 < count; t += 3) {
      const i0 = at(t), i1 = at(t + 1), i2 = at(t + 2);
      const f0 = field.array[i0], f1 = field.array[i1], f2 = field.array[i2];
      if (!isFinite(f0) || !isFinite(f1) || !isFinite(f2)) continue;

      a.fromBufferAttribute(pos, i0).applyMatrix4(m.matrixWorld);
      b.fromBufferAttribute(pos, i1).applyMatrix4(m.matrixWorld);
      c.fromBufferAttribute(pos, i2).applyMatrix4(m.matrixWorld);

      if (clipping) {
        centroid.copy(a).add(b).add(c).multiplyScalar(1 / 3);
        // three keeps the half-space where normal·p + constant > 0.
        if (CLIP.normal.dot(centroid) + CLIP.constant <= 0) { skipped++; continue; }
      }

      const area = 0.5 * ab.subVectors(b, a).cross(ac.subVectors(c, a)).length();
      if (!(area > 0)) continue;

      const fm = (f0 + f1 + f2) / 3;
      sumA += area; sumFA += fm * area; sumF2A += fm * fm * area;
      tris++;
      for (const v of [f0, f1, f2]) { if (v < min) min = v; if (v > max) max = v; }
    }
  }

  if (!tris || !(sumA > 0)) return null;
  const mean = sumFA / sumA;
  // Area-weighted variance, floored at 0 against floating-point drift.
  const std = Math.sqrt(Math.max(0, sumF2A / sumA - mean * mean));
  return { min, max, mean, std, area: sumA, triangles: tris, skipped, clipping };
};

// ── inspect point ────────────────────────────────────────────────────────────
const RAY = new THREE.Raycaster();
window.inspectAt = function (clientX, clientY) {
  if (!meshes.length) return null;
  // Raycasting reads world matrices, and those are only refreshed by
  // renderer.render(). A probe must not depend on a frame having been drawn
  // first: the page may not be compositing at all , so refresh them here.
  scene.updateMatrixWorld(true);
  camera.updateMatrixWorld();
  const r = canvas.getBoundingClientRect();
  RAY.setFromCamera(new THREE.Vector2(
    ((clientX - r.left) / r.width) * 2 - 1,
    -((clientY - r.top) / r.height) * 2 + 1), camera);
  const hit = RAY.intersectObjects(meshes, false)[0];
  if (!hit || !hit.face) return null;

  const g = hit.object.geometry;
  const field = g.getAttribute("aField");
  const pos = g.getAttribute("position");
  let value = null;
  if (field) {
    const v = new THREE.Vector3();
    let best = null, bestD = Infinity;
    for (const i of [hit.face.a, hit.face.b, hit.face.c]) {
      v.fromBufferAttribute(pos, i);
      hit.object.localToWorld(v);
      const d = v.distanceToSquared(hit.point);
      if (d < bestD) { bestD = d; best = i; }
    }
    const raw = field.array[best];
    if (isFinite(raw)) value = raw;
  }
  const faceAttr = g.getAttribute("aFace");
  const faceId = faceAttr ? faceAttr.array[hit.face.a] : null;
  return { value, world: hit.point.toArray(), faceId };
};

// Every face the pointer passes through, nearest first. SimScale calls this
// "select other": on a car the face you want is often the wheel behind the
// bodywork, and no amount of clicking the front one will ever reach it.
window.facesUnderPointer = function (clientX, clientY) {
  if (!meshes.length) return [];
  scene.updateMatrixWorld(true);
  camera.updateMatrixWorld();
  const r = canvas.getBoundingClientRect();
  RAY.setFromCamera(new THREE.Vector2(
    ((clientX - r.left) / r.width) * 2 - 1,
    -((clientY - r.top) / r.height) * 2 + 1), camera);
  const out = [];
  for (const hit of RAY.intersectObjects(meshes, false)) {
    if (!hit.face) continue;
    const attr = hit.object.geometry.getAttribute("aFace");
    if (!attr) continue;
    const id = attr.array[hit.face.a];
    if (!out.includes(id)) out.push(id);
  }
  return out;
};

// Highlight one face group, or -1 to clear. Kept separate from picking so the
// tree can highlight a boundary condition's faces without anyone clicking.
window.selectFace = function (id) {
  const v = id == null ? -1 : +id;
  for (const m of meshes) m.material.uniforms.uSelFace.value = v;
  return v;
};

// Which groups this geometry actually has, and how many triangles each holds —
// enough for the panel to list them without a second request.
window.faceGroups = function () {
  const counts = new Map();
  for (const m of meshes) {
    const f = m.geometry.getAttribute("aFace");
    if (!f) continue;
    for (let i = 0; i < f.count; i += 3) {
      const id = f.array[i];
      counts.set(id, (counts.get(id) || 0) + 1);
    }
  }
  return [...counts.entries()].sort((a, b) => a[0] - b[0])
    .map(([id, triangles]) => ({ id, triangles }));
};

// ── marked faces ─────────────────────────────────────────────────────────────
// Which faces the user has said are wheels. Written into the per-vertex aPick
// attribute rather than passed as a uniform, so any number of faces can be lit
// at once.
window.setPickedFaces = function (ids) {
  const want = new Set((ids || []).map(Number));
  for (const m of meshes) {
    const face = m.geometry.getAttribute("aFace");
    const pick = m.geometry.getAttribute("aPick");
    if (!face || !pick) continue;
    for (let i = 0; i < pick.count; i++) pick.array[i] = want.has(face.array[i]) ? 1 : 0;
    pick.needsUpdate = true;
  }
};

// ── wind tunnel box ──────────────────────────────────────────────────────────
// The Fusion add-in built the tunnel inside Fusion, where the user could see it
// against their car. Here the car is a file, so the box is drawn around it and
// dragged by its walls. Everything below is in MODEL units, not metres: the glb
// arrives in whatever unit the STEP was written in, and the caller converts.
let tunnel = null, tunnelBox = null, dragging = null;
const WALLS = [
  { key: "x1", axis: "x", sign: +1 }, { key: "x0", axis: "x", sign: -1 },
  { key: "y1", axis: "y", sign: +1 }, { key: "y0", axis: "y", sign: -1 },
  { key: "z1", axis: "z", sign: +1 }, { key: "z0", axis: "z", sign: -1 },
];

// Rebuilding the box, keeping any drag in progress. A drag redraws the box on
// every pointer move, so tearing the drag down here would end it after the
// first move and the wall would jump once and then stick.
function disposeTunnel() {
  if (!tunnel) return;
  tunnel.traverse((o) => { o.geometry?.dispose?.(); o.material?.dispose?.(); });
  tunnel.parent?.remove(tunnel);
  tunnel = null; tunnelBox = null;
}

window.showTunnel = function (box) {
  disposeTunnel();
  if (!box || !current) return;
  tunnelBox = { ...box };
  tunnel = new THREE.Group();
  // A child of the model, so it picks up the recentring frame() applied to it.
  // As a sibling it would sit a car's width away from where it belongs.
  current.add(tunnel);

  const sx = box.x1 - box.x0, sy = box.y1 - box.y0, sz = box.z1 - box.z0;
  const mid = [(box.x0 + box.x1) / 2, (box.y0 + box.y1) / 2, (box.z0 + box.z1) / 2];

  const edges = new THREE.LineSegments(
    new THREE.EdgesGeometry(new THREE.BoxGeometry(sx, sy, sz)),
    new THREE.LineBasicMaterial({ color: 0x4a90d9, transparent: true, opacity: 0.9 }));
  edges.position.set(...mid);
  tunnel.add(edges);

  // One mesh per wall, so a drag knows which wall it grabbed. Rendered faintly
  // and written to depth-never, so the car stays visible through the box.
  for (const w of WALLS) {
    const g = w.axis === "x" ? new THREE.PlaneGeometry(sy, sz)
            : w.axis === "y" ? new THREE.PlaneGeometry(sx, sz)
            : new THREE.PlaneGeometry(sx, sy);
    const m = new THREE.Mesh(g, new THREE.MeshBasicMaterial({
      color: 0x4a90d9, transparent: true, opacity: 0.05,
      side: THREE.DoubleSide, depthWrite: false }));
    const p = [...mid];
    p[w.axis === "x" ? 0 : w.axis === "y" ? 1 : 2] = box[w.key];
    m.position.set(...p);
    if (w.axis === "x") m.rotation.y = Math.PI / 2;
    else if (w.axis === "y") m.rotation.x = Math.PI / 2;
    m.userData.wall = w;
    tunnel.add(m);
  }
  scene.updateMatrixWorld(true);
};

window.hideTunnel = function () {
  disposeTunnel();
  dragging = null;
  controls.enabled = true;
};

// Pull the camera back to take in the whole tunnel. The box is around ten times
// the car in every direction, so a view framed on the car shows none of it.
window.frameTunnel = function () {
  if (!tunnel) return;
  const b = new THREE.Box3().setFromObject(tunnel);
  const size = b.getSize(new THREE.Vector3()), c = b.getCenter(new THREE.Vector3());
  const dist = fitDistance(size);
  camera.position.copy(c.clone().add(new THREE.Vector3(...VIEWS.iso).normalize().multiplyScalar(dist)));
  camera.near = dist / 500; camera.far = dist * 50; camera.updateProjectionMatrix();
  controls.target.copy(c); controls.update();
};

function rayFrom(clientX, clientY) {
  const r = canvas.getBoundingClientRect();
  RAY.setFromCamera(new THREE.Vector2(
    ((clientX - r.left) / r.width) * 2 - 1,
    -((clientY - r.top) / r.height) * 2 + 1), camera);
  return RAY;
}

// The pointer ray in the tunnel's own coordinates. The box is a child of the
// model, and the model is moved to recentre it, so a world-space ray compared
// against local box coordinates would be out by that offset.
function localRay(clientX, clientY) {
  const r = rayFrom(clientX, clientY).ray;
  const inv = new THREE.Matrix4().copy(tunnel.matrixWorld).invert();
  const o = r.origin.clone().applyMatrix4(inv);
  const t = r.origin.clone().add(r.direction).applyMatrix4(inv);
  return { origin: o, dir: t.sub(o).normalize() };
}

const AXIS_VEC = {
  x: new THREE.Vector3(1, 0, 0),
  y: new THREE.Vector3(0, 1, 0),
  z: new THREE.Vector3(0, 0, 1),
};

// The plane a wall slides in: it contains the wall's axis and faces the camera
// as squarely as it can. Fixed when the wall is grabbed, so the plane does not
// tilt under the pointer mid-drag.
function dragPlaneNormal(ray, axis) {
  const d = AXIS_VEC[axis];
  const n = ray.dir.clone().sub(d.clone().multiplyScalar(ray.dir.dot(d)));
  return n.lengthSq() < 1e-9 ? null : n.normalize();   // looking down the axis
}

// How far along the axis the pointer is, measured from `origin`.
//
// The obvious reading of "constrain a drag to one axis" is to take the point on
// the axis line closest to the pointer ray. That is well defined but it is not
// a drag: as the pointer crosses the axis the closest point turns around, so
// the wall runs out, stops and comes back while the pointer keeps going. This
// projects onto a plane through the axis instead, which is what a translate
// gizmo does and what the hand expects.
function alongAxis(ray, origin, axis, normal) {
  if (!normal) return null;
  const den = ray.dir.dot(normal);
  if (Math.abs(den) < 1e-9) return null;
  const t = origin.clone().sub(ray.origin).dot(normal) / den;
  const hit = ray.origin.clone().add(ray.dir.clone().multiplyScalar(t));
  return hit.sub(origin).dot(AXIS_VEC[axis]);
}

// Is the pointer over a tunnel wall, and which one. Used for the cursor as well
// as for starting a drag.
window.tunnelWallAt = function (clientX, clientY) {
  if (!tunnel) return null;
  scene.updateMatrixWorld(true);
  const hit = rayFrom(clientX, clientY)
    .intersectObjects(tunnel.children.filter((o) => o.userData.wall), false)[0];
  return hit ? hit.object.userData.wall.key : null;
};

window.startTunnelDrag = function (clientX, clientY) {
  if (!tunnel) return null;
  scene.updateMatrixWorld(true);
  const hit = rayFrom(clientX, clientY)
    .intersectObjects(tunnel.children.filter((o) => o.userData.wall), false)[0];
  if (!hit) return null;
  const w = hit.object.userData.wall;
  const local = tunnel.worldToLocal(hit.point.clone());
  // The line the wall slides along, and the plane it slides in, are both fixed
  // at grab time and reused for every move. Measuring against a different plane
  // each frame would give a displacement that is not the one the pointer made.
  const ray = localRay(clientX, clientY);
  const normal = dragPlaneNormal(ray, w.axis);
  dragging = { wall: w, line: local.clone(), normal, from: tunnelBox[w.key],
               start: alongAxis(ray, local, w.axis, normal) };
  controls.enabled = false;
  return w.key;
};

// Returns the wall's new position in model units, or null. The caller turns it
// into an offset and calls showTunnel again, so the box on screen and the
// numbers in the panel can never drift apart.
window.moveTunnelDrag = function (clientX, clientY) {
  if (!dragging || dragging.start == null) return null;
  const now = alongAxis(localRay(clientX, clientY), dragging.line,
                        dragging.wall.axis, dragging.normal);
  if (now == null) return null;
  return { key: dragging.wall.key, value: dragging.from + (now - dragging.start) };
};

window.endTunnelDrag = function () {
  dragging = null;
  controls.enabled = true;
};

// Anything that changes the scene has to ask for a frame now that the loop
// only draws on demand. Wrapping them here rather than adding a call inside
// each one means a function added later cannot quietly forget: it is listed
// once, in one place, and the list is the contract.
for (const name of ["renderGlb", "applyField", "setClip", "setWireframe",
                    "selectFace", "setPickedFaces", "showTunnel", "hideTunnel",
                    "frameTunnel", "setColourMap", "setRange", "setBands",
                    "moveTunnelDrag", "endTunnelDrag"]) {
  const fn = window[name];
  if (typeof fn !== "function") continue;
  window[name] = function (...args) {
    const out = fn.apply(this, args);
    if (out && typeof out.then === "function") return out.then((v) => (window.requestDraw(), v));
    window.requestDraw();
    return out;
  };
}

// Project a world point to viewport pixels. Returns null when it falls behind
// the camera, so a pin on the far side of the car hides instead of ghosting
// through it.
window.projectPoint = function (world) {
  const v = new THREE.Vector3(...world).project(camera);
  if (v.z > 1) return null;
  const r = canvas.getBoundingClientRect();
  return { x: (v.x * 0.5 + 0.5) * r.width, y: (-v.y * 0.5 + 0.5) * r.height };
};

// The pins have to follow the model when it is orbited, and rAF cannot be
// relied on (it is suspended whenever the page is not compositing), so this is
// driven by OrbitControls' own change event instead.
window.onCameraChange = (fn) => controls.addEventListener("change", fn);

// Everything above is now defined: release anything waiting on the viewer.
window.__viewerReady?.();
</script>

<script>
const sb = window.sb;                 // the shim already made the client

// The 3D viewer lives in a `type="module"` block, which the browser defers —
// it executes after this script has already run boot(). So nothing here may
// touch renderGlb/applyField/setClip until the module says it is ready.
const viewerReady = new Promise((resolve) => { window.__viewerReady = resolve; });

// The setup panels and the results panes are separate files. If one fails to
// load, degrade to a legible message in that one pane rather than throwing out
// of render() and leaving the whole workspace blank.
const MODULE_MISSING = (name) => `<p class="err">${name} failed to load: reload the page.</p>`;
window.WBPanels = window.WBPanels || {
  tree: () => [],
  inspector: () => ({ title: "Setup", subtitle: "", html: MODULE_MISSING("workbench-panels.js") }),
};
window.WBResults = window.WBResults || {
  readout: () => "", convergencePane: () => MODULE_MISSING("workbench-results.js"),
  forcePane: () => MODULE_MISSING("workbench-results.js"),
  comparePane: () => MODULE_MISSING("workbench-results.js"),
};
// Cloud Run tessellation service (OCC kernel). See MIGRATION.md 8c.
const TESSELLATE_URL = window.TESSELLATE_URL
  || "https://turboflow-tessellate-653114694502.us-central1.run.app";
let me = null, state = {
  projects: [], sims: [], geoms: [], jobs: [],
  selSim: null, selJob: null, tab: "runs", compare: new Set(), fields: {},
  // The setup tree node the right-hand inspector is showing. Mirrors SimScale:
  // the tree is the navigation and the panel is whatever the tree has selected.
  selNode: "geometry",
  // Collapsed setup-tree headers, by node id.
  collapsed: new Set(),
  // Inspect-point mode and the pins placed so far.
  inspecting: false, pins: [], fieldValues: null,
  // The account row, because sponsorship and unlimited passes change the price.
  account: null,
  // Edits are held here until Save, so a half-typed velocity never reaches the
  // database and a failed save does not leave the panel showing a value the
  // server rejected.
  draft: null, draftSim: null,
  // The wind tunnel being set up around a raw car, or null when not preparing
  // one. The panel reads nothing else, so what is drawn and what is typed
  // cannot drift apart.
  prep: null,
};

// The setup document for a simulation, defaults filled in. Prefers the local
// draft so the panel reflects what you typed, not what was last saved.
function setupOf(sim) {
  if (!sim) return CFD.withDefaults(null);
  if (state.draft && state.draftSim === sim.id) return state.draft;
  return CFD.withDefaults(sim.setup);
}

// Everything the panels need, assembled once per render.
function panelCtx() {
  const sim = state.sims.find((x) => x.id === state.selSim) || null;
  const geom = sim ? state.geoms.find((g) => g.id === sim.geometry_id) || null : null;
  const project = sim ? state.projects.find((p) => p.id === sim.project_id) || null : null;
  const setup = setupOf(sim);
  const simFor = sim || { inlet_velocity: 20, refine_level: 3, iteration_count: 1000, debug_mesh: false };
  return {
    project, geometry: geom, geometries: state.geoms, sim, setup,
    derived: CFD.derive(simFor, geom, setup, state.account),
    runs: sim ? state.jobs.filter((j) => j.simulation_ref === sim.id) : [],
    version: geom ? geometryVersion(geom) : 0,
    dirty: !!(state.draft && state.draftSim === state.selSim),
  };
}

// ── the two globals every panel control talks to ─────────────────────────────
// A panel is a string of markup, so it cannot close over state. It calls these.
function wbSet(path, value, type) {
  const sim = state.sims.find((x) => x.id === state.selSim);
  if (!sim) return;
  const v = type === "number" ? (value === "" ? null : +value)
          : type === "bool" ? !!value
          : value;
  if (type === "number" && v != null && !isFinite(v)) return;

  if (path.startsWith("sim.")) {
    // The four columns that predate the setup document. They are clamped here
    // to the same bounds on-new-job clamps to, so the screen cannot promise a
    // value the server will quietly change.
    const col = path.slice(4);
    const CLAMP = {
      inlet_velocity: [1, 100], refine_level: [1, 5], iteration_count: [1, 3000],
    }[col];
    sim[col] = CLAMP ? Math.max(CLAMP[0], Math.min(CLAMP[1], v)) : v;
  } else {
    if (!state.draft || state.draftSim !== sim.id) {
      state.draft = CFD.withDefaults(sim.setup); state.draftSim = sim.id;
    }
    const keys = path.split(".");
    let node = state.draft;
    for (const k of keys.slice(0, -1)) node = node[k] ??= {};
    node[keys[keys.length - 1]] = v;
  }
  render();
}

function wbAction(name, arg) {
  const sim = state.sims.find((x) => x.id === state.selSim);
  if (name === "save" && sim) return saveSim(sim.id);
  if (name === "run" && sim) return runSim(sim.id);
  if (name === "cancel" && state.selJob) {
    const j = state.jobs.find((x) => x.id === state.selJob);
    return cancelRun(j.id, j.cost ?? 0);
  }
  if (name === "resetSection" && sim) {
    if (!state.draft || state.draftSim !== sim.id) {
      state.draft = CFD.withDefaults(sim.setup); state.draftSim = sim.id;
    }
    state.draft[arg] = CFD.clone(CFD.DEFAULTS[arg]);
    return render();
  }
  if (name === "discard") { state.draft = state.draftSim = null; return render(); }
  if (name === "edit") return applyEdit(state.selSim);
  if (name === "upload") return autoCfd();
}
window.wbSet = wbSet; window.wbAction = wbAction;

const $ = (id) => document.getElementById(id);
// In-page replacement for prompt()/confirm(). With `input` set it resolves to the
// trimmed string (or null if dismissed); without it, to true/false.
function ask({ title, body = "", input = null, ok = "OK" }) {
  return new Promise((resolve) => {
    const back = $("modal"), field = $("modalInput"), text = $("modalBody");
    const isPrompt = input !== null;
    $("modalTitle").textContent = title;
    text.textContent = body;
    text.classList.toggle("hidden", !body);
    field.classList.toggle("hidden", !isPrompt);
    field.value = input || "";
    $("modalOk").textContent = ok;
    back.classList.remove("hidden");
    // Move focus into the dialog for both shapes: the field for a prompt, the OK
    // button for a confirm. Without this a confirm left focus on the trigger
    // behind the backdrop, invisible to keyboard and screen-reader users.
    (isPrompt ? field : $("modalOk")).focus();

    const done = (v) => {
      back.classList.add("hidden");
      document.removeEventListener("keydown", onKey);
      resolve(v);
    };
    const accept = () => done(isPrompt ? field.value.trim() : true);
    const onKey = (e) => {
      if (e.key === "Escape") done(isPrompt ? null : false);
      else if (e.key === "Enter") accept();
    };
    $("modalOk").onclick = accept;
    $("modalCancel").onclick = () => done(isPrompt ? null : false);
    document.addEventListener("keydown", onKey);
  });
}

function toast(msg, ms = 4000) {
  const t = $("toast"); t.textContent = msg; t.classList.remove("hidden");
  clearTimeout(t._t); t._t = setTimeout(() => t.classList.add("hidden"), ms);
}
function signIn() {
  sb.auth.signInWithOAuth({ provider: "google", options: { redirectTo: location.href } });
}

// The reload has to happen whether or not the server round trip worked, or the
// button looks dead. signOut() revokes the refresh token server-side and that
// call can fail — offline, or a token the server has already dropped — while the
// user's intent still stands, so fall back to clearing this browser's session.
async function signOutNow() {
  // Demo mode has no real session: its stub returns one on every load, so a
  // plain reload lands straight back in. Leaving demo is the honest equivalent.
  if (window.DEMO_MODE) return location.replace("workbench.html");
  const { error } = await sb.auth.signOut().catch((e) => ({ error: e }));
  if (error) await sb.auth.signOut({ scope: "local" }).catch(() => {});
  // One session across the whole site, so signing out here signs out of
  // TurboFlow. Land on the site rather than on this page's sign-in card.
  location.href = "/";
}

async function boot() {
  try {
    const { data: { session } } = await sb.auth.getSession();
    if (!session) { $("gate").classList.remove("hidden"); return; }
    const first = !me;
    me = session.user;
    $("gate").classList.add("hidden");
    $("app").classList.remove("hidden");
    live();
    if (first) await refresh();   // a token refresh is not a reason to refetch
  } catch (e) {
    // getSession() reading local storage rarely rejects, but if it does the
    // finally alone would clear the splash and leave a blank page with no route
    // back. Fall back to the gate so the user can always sign in.
    if ($("app").classList.contains("hidden")) $("gate").classList.remove("hidden");
    toast("Could not restore your session: " + (e.message || e), 8000);
  } finally {
    // The splash must not outlive the decision. Hiding it anywhere but a finally
    // means one thrown request leaves a spinner up with no way back to the gate.
    $("boot").classList.add("hidden");
  }
}

async function refresh() {
  const [p, g, s, j, u] = await Promise.all([
    sb.from("projects").select("*").order("created_at"),
    sb.from("geometries").select("*").order("created_at"),
    sb.from("simulations").select("*").order("created_at"),
    sb.from("jobs").select("*").order("created_at", { ascending: false }),
    sb.from("users").select("credits, sponsored, sponsor_rate, unlimited_until")
      .eq("id", me.id).maybeSingle(),
  ]);
  // Say so rather than rendering an empty tree that looks like "no projects".
  const failed = [p, g, s, j, u].find((r) => r.error);
  if (failed) toast("Could not load your projects: " + failed.error.message, 8000);

  state.projects = p.data || []; state.geoms = g.data || [];
  state.sims = s.data || [];     state.jobs = j.data || [];
  state.account = u.data || null;
  $("credits").textContent = (u.data?.credits ?? 0) + " credits";

  // Open on something. An empty viewport with "select a simulation" is a wall
  // between the user and their own work — they came here to look at a result,
  // so land them on the most recent one that has something to show.
  if (!state.selSim && state.sims.length) {
    const withResults = state.jobs.find((x) => x.results_glb_path);
    const seed = withResults
      ? state.sims.find((x) => x.id === withResults.simulation_ref)
      : null;
    const sim = seed || state.sims[state.sims.length - 1];
    if (sim) {
      state.selSim = sim.id;
      const latest = state.jobs.find((x) => x.simulation_ref === sim.id);
      state.selJob = (withResults && withResults.simulation_ref === sim.id)
        ? withResults.id : (latest?.id ?? null);
    }
  }
  render();
}

// Realtime: the tree and run list keep themselves current while a job runs.
//
// Subscribe once. onAuthStateChange fires on every token refresh — hourly — and
// an unguarded subscribe there stacks a new channel each time, so by the end of
// an afternoon a single job update would trigger a fistful of refetches.
let channel = null;
function live() {
  if (channel) return;
  channel = sb.channel("workbench");
  for (const table of ["jobs", "projects", "simulations", "geometries"]) {
    channel.on("postgres_changes", { event: "*", schema: "public", table }, refresh);
  }
  channel.subscribe((status) => {
    if (status === "CHANNEL_ERROR" || status === "TIMED_OUT") {
      toast("Live updates dropped: reload to reconnect.", 6000);
    }
  });
}

// Semantic glyph per setup-tree node type. The shape carries the node's meaning
// (flow in/out, wall, wheel, mesh, run…) so the tree is legible at a glance;
// colour is spent only where it is information itself , teal flow-in at the
// inlet, amber flow-out at the outlet , with everything structural left neutral.
// Returns "" for ids that have no glyph.
function nodeIcon(id) {
  const G = {
    geometry: '<path d="M8 2 14 5v6l-6 3-6-3V5z"/><path d="M2 5l6 3 6-3M8 8v6"/>',
    analysis: '<path d="M2 6h7a2 2 0 1 0-2-2"/><path d="M2 10h6a2 2 0 1 1-2 2"/>',
    material: '<path d="M8 2.5c2.4 3 3.8 4.9 3.8 6.8a3.8 3.8 0 0 1-7.6 0C4.2 7.4 5.6 5.5 8 2.5z"/>',
    "bc:inlet": '<path d="M2 8h7M6 5l3 3-3 3M12.5 3v10"/>',
    "bc:outlet": '<path d="M3.5 3v10M7 8h7M11 5l3 3-3 3"/>',
    "bc:ground": '<path d="M2 10.5h12M4 10.5l-1.5 2.5M8 10.5l-1.5 2.5M12 10.5l-1.5 2.5"/>',
    "bc:top": '<path d="M2 5.5h12M4 5.5l-1.5-2.5M8 5.5l-1.5-2.5M12 5.5l-1.5-2.5"/>',
    "bc:sides": '<path d="M4 2.5v11M12 2.5v11"/>',
    "bc:symmetry": '<path d="M8 2v12" stroke-dasharray="2 2"/><path d="M4.5 6 6.5 8l-2 2M11.5 6 9.5 8l2 2"/>',
    "bc:car": '<path d="M2 10.5h12M3.6 10.5 4.8 7.4h6.4l1.2 3.1"/><circle cx="5.6" cy="10.6" r="1.15"/><circle cx="10.4" cy="10.6" r="1.15"/>',
    "bc:wheels": '<circle cx="8" cy="8" r="5.2"/><circle cx="8" cy="8" r="1.7"/>',
    numerics: '<path d="M11.5 3.2H4.5l3.8 4.8-3.8 4.8h7"/>',
    control: '<path d="M3 4.5h10M3 8h10M3 11.5h10"/><circle cx="6" cy="4.5" r="1.4"/><circle cx="10" cy="8" r="1.4"/><circle cx="5" cy="11.5" r="1.4"/>',
    results: '<path d="M2.5 13.5h11M4.5 13V8.5M8 13V4.5M11.5 13V6.5"/>',
    mesh: '<path d="M2.5 2.5h11v11h-11z"/><path d="M6 2.5v11M10 2.5v11M2.5 6h11M2.5 10h11"/>',
    runs: '<path d="M5.5 3.5v9l7-4.5z"/>',

  const g = G[id];

            : id === "bc:outlet" ? "var(--warn)"

            : "var(--ink-2)";
  return `<span class="tnode-ic" style="color:${col}"><svg viewBox="0 0 16 16" aria-hidden="true">${g}</svg></span>`;
