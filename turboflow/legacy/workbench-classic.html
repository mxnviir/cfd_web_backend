function render() {
  // ── tree ──
  // Project > simulation > the setup tree, the way SimScale lays it out: the
  // tree is the navigation, and whatever is selected is what the right-hand
  // panel edits. The setup nodes only appear under the selected simulation —
  // showing eight setup children for every simulation in the project turns the
  // tree into a wall.
  const t = $("tree"); t.innerHTML = "";
  const unfiled = state.jobs.filter((j) => !j.project_id);
  const ctx = panelCtx();

  // ── GEOMETRIES ── the section SimScale puts first: every uploaded or edited
  // solid, independent of which simulation uses it. Clicking one jumps to a
  // simulation that runs it, landing on the geometry panel.
  t.insertAdjacentHTML("beforeend",
    `<div class="group-label"><span class="eyebrow">Geometries (${state.geoms.length})</span></div>`);
  for (const g of state.geoms) {
    const d = document.createElement("button");
    const usedBy = state.sims.find((s) => s.geometry_id === g.id);
    d.className = "row child" + (ctx.geometry?.id === g.id && state.selNode === "geometry" ? " sel" : "");
    d.innerHTML = `<span class="grow">${esc(g.name)}</span><span class="ver">v${geometryVersion(g)}</span>`;
    d.onclick = () => {
      if (usedBy) { state.selSim = usedBy.id; state.selJob = null; state.selNode = "geometry"; render(); }
      else toast("No simulation uses this geometry yet.");
    };
    t.appendChild(d);
  }
  if (!state.geoms.length) t.insertAdjacentHTML("beforeend", `<div class="empty">No geometries uploaded.</div>`);

  // ── SIMULATIONS ──
  t.insertAdjacentHTML("beforeend",
    `<div class="group-label" style="margin-top:var(--s2)"><span class="eyebrow">Simulations</span></div>`);
  for (const p of state.projects) {
    const sims = state.sims.filter((s) => s.project_id === p.id);
    const el = document.createElement("div");
    el.innerHTML = `<div class="group-label">${esc(p.name)}</div>`;
    for (const s of sims) {
      const runs = state.jobs.filter((j) => j.simulation_ref === s.id).length;
      const d = document.createElement("button");
      d.className = "row child" + (state.selSim === s.id ? " sel" : "");
      d.innerHTML = `<span class="grow">${esc(s.name)}</span><span class="num muted">${runs}</span>`;
      d.onclick = () => { state.selSim = s.id; state.selJob = null; state.selNode = "geometry"; render(); };
      el.appendChild(d);

      if (state.selSim === s.id && window.WBPanels) {
        // Headers collapse. Boundary conditions alone is eight rows, and a tree
        // you have to scroll to reach Mesh is a tree nobody uses.
        let hiddenUnder = null;
        for (const n of WBPanels.tree(ctx)) {
          if (hiddenUnder !== null) {
            if (n.depth > hiddenUnder) continue;      // still inside a collapsed header
            hiddenUnder = null;
          }
          const indent = 10 + n.depth * 13;
          if (n.kind === "header") {
            const open = !state.collapsed.has(n.id);
            if (!open) hiddenUnder = n.depth;
            const h = document.createElement("button");
            h.className = "row";
            h.style.cssText = `padding-left:${indent}px;color:var(--ink-3)`;
            h.setAttribute("aria-expanded", String(open));
            h.innerHTML = `<span class="twist" aria-expanded="${open}">
                 <svg viewBox="0 0 10 10"><path d="M1 3h8L5 8z"/></svg></span>
               <span class="grow eyebrow" style="color:inherit">${esc(n.label)}</span>`;
            h.onclick = () => {
              state.collapsed.has(n.id) ? state.collapsed.delete(n.id) : state.collapsed.add(n.id);
              render();
            };
            el.appendChild(h);
            continue;
          }
          const b = document.createElement("button");
          b.className = "row" + (state.selNode === n.id ? " sel" : "");
          b.style.paddingLeft = `${indent + 12}px`;
          b.dataset.node = n.id;
          b.innerHTML =
            `<span class="dot dot-${n.state || "none"}" title="${esc(n.hint || n.state || "")}"></span>`
            + nodeIcon(n.id)
            + `<span class="grow">${esc(n.label)}</span>`
            + (n.badge ? `<span class="num muted">${esc(n.badge)}</span>` : "");
          b.onclick = () => { state.selNode = n.id; render(); };
          el.appendChild(b);
        }
      }
    }
    if (!sims.length) el.insertAdjacentHTML("beforeend", `<div class="empty">No simulations</div>`);
    t.appendChild(el);
  }
  if (unfiled.length) {
    // Pre-workbench runs. Given its own heading rather than sitting inline with
    // the project names: at the same indent it reads as a project called
    // "Unfiled runs", which is not what it is.
    t.insertAdjacentHTML("beforeend",
      `<div class="group-label" style="margin-top:var(--s2)"><span class="eyebrow">Before projects</span></div>`);
    const d = document.createElement("button");
    d.className = "row child" + (state.selSim === "unfiled" ? " sel" : "");
    d.innerHTML = `<span class="grow">Unfiled runs</span><span class="num muted">${unfiled.length}</span>`;
    d.onclick = () => { state.selSim = "unfiled"; state.selJob = null; render(); };
    t.appendChild(d);
  }
  if (!state.projects.length && !unfiled.length)
    t.innerHTML = `<div class="firstrun">
        <p class="firstrun-lead">Nothing here yet.</p>
        <p class="firstrun-sub">Load a finished run to explore the tools: fields, cutting plane, forces and compare , on a real car.</p>
        <button class="btn btn-primary btn-block" onclick="location.href='workbench.html?demo'">
          See a worked example</button>
        <p class="firstrun-note">Or click <b>Automatic CFD</b> above to upload your own
          geometry. You'll need an entity_labels.csv from the Fusion plugin.</p>
      </div>`;

  // ── runs ──
  const runs = state.selSim === "unfiled"
    ? state.jobs.filter((j) => !j.project_id)
    : state.jobs.filter((j) => j.simulation_ref === state.selSim);
  // Column header, so the drag column reads as a column of numbers rather than
  // a value floating at the end of each line.
  const r = $("runs");
  r.innerHTML = `<div class="runs-head">
      <span style="flex:0 0 12px"></span><span class="c-tag">Status</span>
      <span class="grow">Run</span><span class="c-drag">Drag N</span><span class="c-date">Date</span>
    </div>`;
  for (const j of (state.selSim ? runs : state.jobs)) {
    // A div, not a button, because it contains a checkbox — so it has to carry
    // the keyboard affordances a button would have given for free.
    const d = document.createElement("div");
    d.className = "row" + (state.selJob === j.id ? " sel" : "");
    d.tabIndex = 0;
    d.setAttribute("role", "button");
    d.setAttribute("aria-pressed", String(state.selJob === j.id));
    d.onkeydown = (ev) => {
      if (ev.key === "Enter" || ev.key === " ") { ev.preventDefault(); d.click(); }
    };
    d.innerHTML = `
      <input type="checkbox" class="pick" ${state.compare.has(j.id) ? "checked" : ""}
             title="Add to comparison" aria-label="Compare this run">
      <span class="c-tag"><span class="tag t-${esc(j.status)}">${esc(j.status)}</span></span>
      <span class="grow">${esc(j.file_name || j.part || j.id.slice(0, 8))}</span>
      <span class="num c-drag">${j.drag_n != null ? (+j.drag_n).toFixed(3) : ": "}</span>
      <span class="num c-date">${new Date(j.created_at).toLocaleDateString(undefined, { day: "2-digit", month: "short" })}</span>`;
    d.onclick = (ev) => {
      if (ev.target.classList.contains("pick")) {
        state.compare.has(j.id) ? state.compare.delete(j.id) : state.compare.add(j.id);
      } else {
        state.selJob = j.id;
      }
      render();
    };
    r.appendChild(d);
  }
  if (r.children.length === 1) r.insertAdjacentHTML("beforeend", `<div class="empty">No runs yet.</div>`);

  // ── viewer: geometry of the selected simulation, results of the selected run ──
  const simSel = state.sims.find((x) => x.id === state.selSim);
  const geom = simSel && state.geoms.find((g) => g.id === simSel.geometry_id);
  const job = state.jobs.find((j) => j.id === state.selJob);
  showModel();                       // reconciles against current selection
  // A run is measured against the setup it was launched with, not whatever the
  // simulation says today: otherwise editing a case silently relabels every
  // result that came before the edit.
  const jobSetup = CFD.withDefaults(job?.setup_snapshot ?? simSel?.setup);
  const jobDerived = !job ? null : CFD.derive({
    inlet_velocity: job.inlet_velocity, refine_level: job.refine_level,
    iteration_count: job.iteration_count, debug_mesh: job.debug_mesh,
  }, geom, jobSetup);

  $("viewer").innerHTML = !job ? "" : WBResults.readout({
    job, derived: jobDerived, setup: jobSetup,
    refundable: REFUNDABLE.has(job.status),
    helpers: { lineChart, esc, deltaHtml },
  });

  // ── inspector: whatever the setup tree has selected ──
  if (!ctx.sim) {
    $("inspTitle").textContent = "Simulation setup";
    $("inspSub").textContent = "";
    $("insp").innerHTML = `<p class="muted">Select a simulation, or start one with Automatic CFD.</p>`;
  } else {
    const panel = WBPanels.inspector(state.selNode, ctx);
    $("inspTitle").textContent = panel.title;
    $("inspSub").textContent = panel.subtitle || "";
    $("inspDirty").textContent = ctx.dirty ? "unsaved" : "";
    $("insp").innerHTML = markNotes(panel.html)
      + (state.selNode === "geometry" ? geometryEditControls(ctx) : "")
      + `<div style="margin:var(--s5) 0 var(--s4)">
           <button class="btn btn-block" style="margin-bottom:var(--s2)" onclick="wbAction('save')">
             Save setup${ctx.dirty ? " •" : ""}</button>
           <button class="btn btn-primary btn-block" onclick="wbAction('run')">
             Run simulation: ${ctx.derived.unlimited ? "free" : ctx.derived.cost + " cr"}</button>
           ${ctx.derived.discounted ? `<p class="panel-note" style="margin-top:var(--s2)">${
             ctx.derived.unlimited
               ? `Covered by your unlimited pass: the list price is
                  ${ctx.derived.listCost} cr.`
               : `Sponsored rate ${Math.round(ctx.derived.sponsorRate * 100)}% ,
                  list price ${ctx.derived.listCost} cr.`}</p>` : ""}
         </div>`;
    applyNotes();          // innerHTML wiped the class, so reapply every render
  }

  renderJobStatus();
  renderCharts();
}

// ── job status panel ──
// The worker walks a fixed status sequence and writes each stage to the row;
// progress is the position in that sequence, not an animation.
const STAGES = ["queued", "pending", "downloading", "uploading_geometry",
                "processing", "creating_simulation", "meshing", "running", "complete"];
function renderJobStatus() {
  const el = $("jobstatus");
  const job = state.jobs.find((j) => j.id === state.selJob);
  if (!job) { el.classList.add("hidden"); return; }
  el.classList.remove("hidden");
  const idx = STAGES.indexOf(job.status);
  const pct = job.status === "complete" ? 100
            : job.status === "failed" || job.status === "cancelled" ? 100
            : idx >= 0 ? Math.round(idx / (STAGES.length - 1) * 100) : 0;
  // created_at is a database string and can be absent on a row this client
  // built optimistically, or unparseable. An unknown age must show nothing
  // rather than "NaN d": the age is decoration, the status is the point.
  const startedMs = Date.parse(job.created_at);
  const mins = Number.isFinite(startedMs)
    ? Math.max(0, Math.round((Date.now() - startedMs) / 60000)) : null;
  const when = mins == null ? ""
    : mins < 60 ? `${mins} min`
    : mins < 2880 ? `${Math.round(mins / 60)} h`
    : `${Math.round(mins / 1440)} d`;
  const live = !["complete", "failed", "cancelled"].includes(job.status);
  el.innerHTML = `
    <span class="eyebrow">Job status</span>
    <div style="display:flex;justify-content:space-between;align-items:baseline;margin-top:var(--s1)">
      <span class="tag t-${esc(job.status)}">${esc(job.status)}</span>
      <span class="num muted">${when ? (live ? `started ${when} ago` : when) : ""}</span>
    </div>
    <div class="bar"><i style="width:${pct}%${job.status === "failed" ? ";background:var(--bad)" : ""}"></i></div>
    <div class="stages">${
      job.status === "failed" ? "Failed. Open the run for the error."
      : job.status === "cancelled" ? "Cancelled and refunded."
      : job.status === "complete" ? "Solve finished, results are loaded."
      : idx >= 0 ? `Stage ${idx + 1} of ${STAGES.length}: ${esc(job.status.replace(/_/g, " "))}`
      : esc(job.status)}</div>`;
}

// Signed URL, because the bucket is private: RLS lets you read only your own
// jobs/<uid>/ folder, and this hands the browser a short-lived link to it.
const signed = async (path, secs = 3600) => {
  const { data, error } = await sb.storage.from("cfd-files").createSignedUrl(path, secs);
  if (error) throw error;
  return data.signedUrl;
};

// A finished run shows its solution surface; anything else shows the raw
// geometry, so the viewport is never empty while you wait.
// The cache key has to include which run's fields go with the surface, not just
// the surface. Keying on the path alone means selecting a run whose results glb
// resolves to a path already on screen skips the whole function — so the field
// dropdown stays empty and the post-processing bar never appears, on a run that
// has fields. Nothing errors; the results are simply not offered.
// Loading the model is a reconciler, not a per-call action.
//
// render() runs many times in the first few hundred milliseconds — boot() is
// invoked once directly and once by onAuthStateChange, and four Realtime
// channels all point at refresh(). Any scheme that tries to cancel or dedupe
// individual overlapping calls ends up cancelling the last one standing too,
// and the viewport stays empty with nothing thrown and nothing logged.
//
// So: render() only says "the selection may have changed". A single loop owns
// the viewport, re-reads the CURRENT selection each time round, and stops when
// what is drawn matches what is selected. Overlapping requests collapse into
// that one loop by construction rather than by bookkeeping.
let shown = null, syncing = false;

function desiredModel() {
  const sim = state.sims.find((x) => x.id === state.selSim);
  const geom = sim && state.geoms.find((g) => g.id === sim.geometry_id);
  const job = state.jobs.find((j) => j.id === state.selJob);
  const path = job?.results_glb_path || geom?.glb_path || null;
  const fields = job?.results_glb_path ? (job.results_fields || {}) : {};
  return { path, fields, key: path + "|" + Object.keys(fields).sort().join(",") };
}

function showModel() {
  if (syncing) return;                   // the loop will pick up the new state
  syncing = true;
  queueMicrotask(async () => {
    try {
      await viewerReady;
      for (let guard = 0; guard < 6; guard++) {
        const { path, fields, key } = desiredModel();
        if (key === shown) return;
        const sameGeometry = shown && shown.split("|")[0] === path;

        const sel = $("fieldSel"), names = Object.keys(fields);
        $("post").classList.toggle("hidden", !names.length);
        sel.innerHTML = names.map((n) => `<option value="${esc(n)}">${esc(fields[n].label || n)}</option>`).join("");
        state.fields = fields;

        if (!path) { shown = key; await window.renderGlb(null); continue; }
        try {
          // Redrawing the same surface would reset the camera mid-comparison,
          // so only reload the geometry when it has actually changed.
          if (!sameGeometry) await window.renderGlb(await signed(path));
          if (names.length) await loadField(); else window.applyField(null);
          applyClip();
          shown = key;
        } catch (e) {
          toast("Could not draw the model: " + (e.message || e));
          return;                        // do not spin on a failing asset
        }
      }
    } finally { syncing = false; }
  });
}

// Fields are raw Float32 blobs, one value per vertex — fetch, hand to the shader.
async function loadField() {
  const name = $("fieldSel").value, f = state.fields?.[name];
  if (!f) return window.applyField(null);
  try {
    const buf = await (await fetch(await signed(f.path))).arrayBuffer();
    const values = new Float32Array(buf);
    // Kept for the Statistics panel — stats must come from the buffer that is
    // actually colouring the surface, not from stored min/max metadata.
    // A pin records the value of the field it was taken with. Leaving pins up
    // across a field change would relabel a pressure reading as a velocity, so
    // they go when the field does.
    if (state.pins.length && state.pins[0].field !== name) clearPins();
    state.fieldValues = values;
    window.applyField(values, f.min, f.max);
    $("legMin").value = fmtNum(f.min);
    $("legMax").value = fmtNum(f.max);
    applyColourMap();
    renderLegendTicks(f.min, f.max);
    renderStats();
  } catch (e) {
    toast("Could not load " + name + ": " + (e.message || e));
  }
}

function applyClip() {
  const axis = $("clipAxis")?.value;
  window.setClip(axis || null, axis ? +$("clipT").value : null);
  renderStats();          // the statistics describe the visible surface
}

// ── post-processing controls ─────────────────────────────────────────────────
// Coerce once, then decide. The previous version tested Math.abs(v) but called
// v.toExponential() on the RAW value, so anything non-numeric that coerces to a
// small number — `[]` coerces to 0 — threw TypeError and took the whole legend
// render down with it. Values here come from results_fields, which is jsonb.
const fmtNum = (v) => {
  if (v == null || v === "") return "";
  const n = +v;
  if (!Number.isFinite(n)) return "n/a";
  const a = Math.abs(n);
  return (a >= 1000 || (a < 0.01 && n !== 0)) ? n.toExponential(2) : n.toFixed(2);
};

function applyRange() {
  const lo = parseFloat($("legMin").value), hi = parseFloat($("legMax").value);
  if (!window.setRange(lo, hi)) {
    toast("Colour range needs a minimum below the maximum.");
    return resetRange();
  }
  renderLegendTicks(lo, hi);
}
function resetRange() {
  const f = state.fields?.[$("fieldSel")?.value];
  if (!f) return;
  $("legMin").value = fmtNum(f.min); $("legMax").value = fmtNum(f.max);
  window.setRange(f.min, f.max);
  renderLegendTicks(f.min, f.max);
}

  const n = $("cmapSel").value;

  window.setColourMap(n);

}

function addPin(ev) {
  if (!state.inspecting) return;
  const hit = window.inspectAt(ev.clientX, ev.clientY);
  if (!hit) return toast("No surface there. Click on the car.");
  if (hit.value == null) return toast("That point has no value for this field.");

function clearPins() { state.pins = []; drawPins(); }

function drawPins() {
  const host = $("pins");
  if (!host) return;
  host.innerHTML = "";
  state.pins.forEach((p, i) => {
    const s = window.projectPoint(p.world);
    if (!s) return;                        // behind the camera
    const el = document.createElement("div");
    el.className = "pin";
    el.style.left = s.x + "px"; el.style.top = s.y + "px";
    el.innerHTML = `<i></i><b title="Click to remove">${esc(fmtNum(p.value))}</b>`;
    el.querySelector("b").onclick = () => { state.pins.splice(i, 1); drawPins(); };
    host.appendChild(el);

// Statistics over the field buffer currently colouring the surface. Per-vertex,
// whole surface: that is what is computable honestly from what the browser
// has, and the label says so. (Area weighting needs triangle areas; C2 covers
// upgrading this once per-face groups arrive with face picking.)
function renderStats() {
  const panel = $("statsPanel");
  if (panel.classList.contains("hidden")) return;
  const name = $("fieldSel")?.value, f = state.fields?.[name], v = state.fieldValues;
  if (!f || !v?.length) {
    panel.innerHTML = `<span class="eyebrow">Statistics</span>
      <p class="note">No field loaded: pick a run with results.</p>`;
    return;
  }
  const s = window.fieldStats();
  if (!s) {
    panel.innerHTML = `<span class="eyebrow">Statistics</span>
      <p class="note">Nothing to measure: the cutting plane has removed the whole surface.</p>`;
    return;
  }
  // Areas are square metres on a car about 0.2 m long, so cm² reads better than
  // a string of leading zeros.
  const cm2 = s.area * 1e4;
  panel.innerHTML = `
    <span class="eyebrow">Statistics: ${esc(f.label || name)}</span>
    <dl>
      <dt>Minimum</dt><dd class="num">${fmtNum(s.min)}</dd>
      <dt>Maximum</dt><dd class="num">${fmtNum(s.max)}</dd>
      <dt>Mean</dt><dd class="num">${fmtNum(s.mean)}</dd>
      <dt>Std deviation</dt><dd class="num">${fmtNum(s.std)}</dd>
      <dt>Wetted area</dt><dd class="num">${fmtNum(cm2)} cm²</dd>
      <dt>Triangles</dt><dd class="num">${s.triangles.toLocaleString()}</dd>
    </dl>
    <p class="note">Mean and deviation are weighted by triangle area, so a
      finely-meshed nose does not outvote a large flat panel.${
      s.clipping ? ` Cut plane is on: ${s.skipped.toLocaleString()} triangles
      excluded.` : ""}</p>`;
}

// Quartiles only — the endpoints are the two inputs flanking the bar.
function renderLegendTicks(min, max) {
  const el = $("legendTicks");
  if (!el || !isFinite(min) || !isFinite(max)) return;
  el.innerHTML = [0.25, 0.5, 0.75].map((t) =>
    `<i style="left:${t * 100}%"></i>` +
    `<span style="left:${t * 100}%">${fmtNum(min + (max - min) * t)}</span>`).join("");
}
function saveShot() {
  const job = state.jobs.find((j) => j.id === state.selJob);
  const field = $("fieldSel")?.value;
  window.snapshot([job?.file_name?.replace(/\.\w+$/, "") || "geometry", field, job?.id?.slice(0, 8)]
    .filter(Boolean).join("_"));
}

// Turn the uploaded STEP into something the browser can draw. The service runs
// the OCC kernel; without it we still have a valid job, just no 3D preview.
// Derive the face labels from the STEP itself. The worker cannot apply a single
// boundary condition without them, and this runs BEFORE the job row is inserted
// so a geometry we cannot label never reaches the charge in on-new-job.
// Returns the label path, or null with the user told why.
async function inferLabels(stepPath, destPath) {
  if (!TESSELLATE_URL) return null;
  try {
    const { data: { session } } = await sb.auth.getSession();
    const r = await fetch(TESSELLATE_URL + "/infer_labels", {
      method: "POST",
      headers: { "Content-Type": "application/json", Authorization: `Bearer ${session.access_token}` },
      body: JSON.stringify({ step_path: stepPath, dest_path: destPath }),
    });
    const out = await r.json();
    // 422 means the service looked and does not believe this is a car in a wind
    // tunnel. It says why, per reason — surface that rather than a status code,
    // because "422" tells the user nothing they can act on.
    const why = (out.warnings || []).join("; ");
    if (r.status === 422) {
      toast("Could not label this geometry: " + (why || out.error)
        + ". Attach an entity_labels.csv from the Fusion plugin instead.", 12000);
      return null;
    }
    // 409 is the service's write-once guard: labels are already at that path.
    // Nothing was overwritten and nothing is wrong — the run can use them.
    if (r.status === 409) return destPath;
    if (!r.ok) throw new Error(out.error || r.status);
    if (out.confident === false) {
      toast("Labelled, but not confidently: " + why
        + ". Check the result before trusting it.", 12000);
    }
    return out.label_path || destPath;
  } catch (e) {
    toast("Automatic face labelling failed: " + (e.message || e), 8000);
    return null;
  }
}

async function tessellate(geomId, stepPath) {
  if (!TESSELLATE_URL) return;
  try {
    const { data: { session } } = await sb.auth.getSession();
    const r = await fetch(TESSELLATE_URL + "/tessellate", {
      method: "POST",
      headers: { "Content-Type": "application/json", Authorization: `Bearer ${session.access_token}` },
      body: JSON.stringify({ step_path: stepPath }),
    });
    const out = await r.json();
    if (!r.ok) throw new Error(out.error || r.status);
    await sb.from("geometries").update({
      glb_path: out.glb_path, face_count: out.face_count,
      solid_count: out.solid_count, triangle_count: out.triangle_count, bbox: out.bbox,
    }).eq("id", geomId);
    // Every model is tessellated face by face now, so there is no flat-mesh
    // case left to warn about. A geometry with no faces at all did not load.
    if (Array.isArray(out.faces) && out.faces.length === 0) {
      toast("This geometry has no faces to pick.", 7000);
    }
    refresh();
  } catch (e) {
    toast("Geometry preview unavailable: " + (e.message || e), 6000);
  }
}

// ── charts ───────────────────────────────────────────────────────────────────
// Hand-drawn SVG rather than a charting library: two line charts do not justify
// 200 KB of dependency, and this way the axes match the rest of the type.
// Series colours for a white ground. The previous set was mixed for a dark
// background — on paper those pastels sit at roughly the same lightness as the
// page and a thin 1.5px trace disappears into it. These are all dark enough to
// hold a hairline stroke, and separated in hue rather than only in lightness so
// they stay distinguishable to a red-green colour-blind reader.
// tests/test_results_pane.mjs asserts this matches workbench-results.js.
const SERIES_COLOURS = ["#1d4e89", "#2e7d5b", "#b0651a", "#a8324a", "#5b4b9e", "#17706e"];

function lineChart(series, xs, { log = false, unit = "" } = {}) {
  const W = 720, H = 170, L = 52, R = 12, T = 10, B = 22;
  const pts = series.filter((s) => s.values?.some((v) => v != null));
  if (!pts.length || !xs?.length) return `<p class="empty">No data.</p>`;

  const all = pts.flatMap((s) => s.values).filter((v) => v != null && (!log || v > 0));
  let lo = Math.min(...all), hi = Math.max(...all);
  if (log) { lo = Math.log10(lo); hi = Math.log10(hi); }
  if (hi === lo) { hi = lo + 1; }
  const pad = (hi - lo) * 0.06; lo -= pad; hi += pad;

  const x0 = xs[0], x1 = xs[xs.length - 1] || 1;
  const px = (x) => L + ((x - x0) / Math.max(x1 - x0, 1e-9)) * (W - L - R);
  const py = (v) => {
    const t = ((log ? Math.log10(v) : v) - lo) / (hi - lo);
    return H - B - t * (H - T - B);
  };

  const ticks = 4;
  const grid = Array.from({ length: ticks + 1 }, (_, i) => {
    const v = lo + ((hi - lo) * i) / ticks;
    const y = H - B - (i / ticks) * (H - T - B);
    const label = log ? `1e${Math.round(v)}`
      : Math.abs(v) >= 1000 || (Math.abs(v) < 0.01 && v !== 0) ? v.toExponential(1) : v.toFixed(3);
    return `<line class="grid" x1="${L}" x2="${W - R}" y1="${y}" y2="${y}"/>
            <text class="axis" x="${L - 6}" y="${y + 3}" text-anchor="end">${label}</text>`;
  }).join("");

  const paths = pts.map((s, i) => {
    const d = s.values.map((v, k) => (v == null || (log && v <= 0))
      ? null : `${px(xs[k])},${py(v)}`).filter(Boolean).join(" L ");
    return d ? `<path d="M ${d}" stroke="${SERIES_COLOURS[i % SERIES_COLOURS.length]}"/>` : "";
  }).join("");

  const legend = pts.map((s, i) =>
    `<span><i class="swatch" style="background:${SERIES_COLOURS[i % SERIES_COLOURS.length]}"></i>${esc(s.name)}</span>`).join("");

  return `<svg class="chart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">
      ${grid}
      <line class="grid" x1="${L}" x2="${W - R}" y1="${H - B}" y2="${H - B}"/>
      <text class="axis" x="${L}" y="${H - 7}">${Math.round(x0)}</text>
      <text class="axis" x="${W - R}" y="${H - 7}" text-anchor="end">${Math.round(x1)} iterations${unit ? " · " + unit : ""}</text>
      ${paths}
    </svg><div class="chart-legend">${legend}</div>`;
}

// Percent change against the baseline run.
//
// Sign convention, because it is the easy thing to ship backwards: these are
// drag and lift in newtons, where a body pointing into the flow gives negative
// force. What a team wants is "less drag than the baseline", so compare
// magnitudes and call a smaller magnitude an improvement, whatever the sign.
// A raw (v - b) would paint -0.19 N as a 10% regression against -0.17 N when it
// is actually more drag, and would flip meaning entirely if the sign convention
// ever changed.
function deltaHtml(v, b) {
  if (v == null || b == null || !isFinite(v) || !isFinite(b) || b === 0) return "";
  const pct = ((Math.abs(v) - Math.abs(b)) / Math.abs(b)) * 100;
  if (!isFinite(pct) || Math.abs(pct) < 0.05) return `<span class="muted"> ±0%</span>`;
  return `<span class="${pct < 0 ? "good" : "bad"}"> ${pct > 0 ? "+" : ""}${pct.toFixed(1)}%</span>`;
}

function setTab(name) {
  state.tab = name;
  for (const el of document.querySelectorAll(".tab")) el.classList.toggle("sel", el.dataset.tab === name);
  for (const id of ["runs", "conv", "force", "cmp"]) $(id).classList.toggle("hidden", id !== name);
  renderCharts();
}

// Run-vs-run. The question every team actually asks is "did that change make it
// faster", which needs the same numbers side by side and the force traces on one
// pair of axes — not two screenshots held up next to each other.
function renderCompare() {
  const picked = state.jobs.filter((j) => state.compare.has(j.id));
  $("cmpCount").textContent = picked.length || "";
  const pane = $("cmp");
  if (picked.length < 2) {
    pane.innerHTML = `<p class="empty">Tick two or more runs to compare them.</p>`;
    return;
  }
  // Each run carries its own derived quantities, because two runs being
  // compared may have been launched at different velocities against different
  // geometry versions — which is exactly when a coefficient is worth more than
  // a force.
  pane.innerHTML = WBResults.comparePane(resultCtx(picked[0], {
    jobs: picked,
    derivedFor: Object.fromEntries(picked.map((j) => [j.id, resultCtx(j).derived])),
    setupFor: Object.fromEntries(picked.map((j) => [j.id, resultCtx(j).setup])),
  }));
}

// A chart on its own says the residuals went down. Whether they went down far
// enough is the actual question, so every pane pairs the trace with the verdict.
function resultCtx(job, extra) {
  const sim = job && state.sims.find((x) => x.id === job.simulation_ref);
  const geom = sim && state.geoms.find((g) => g.id === sim.geometry_id);
  const setup = CFD.withDefaults(job?.setup_snapshot ?? sim?.setup);
  return Object.assign({
    job, setup,
    derived: !job ? null : CFD.derive({
      inlet_velocity: job.inlet_velocity, refine_level: job.refine_level,
      iteration_count: job.iteration_count, debug_mesh: job.debug_mesh,
    }, geom, setup),
    helpers: { lineChart, esc, deltaHtml },
  }, extra);
}

function renderCharts() {
  const job = state.jobs.find((j) => j.id === state.selJob);
  const ctx = resultCtx(job);
  $("conv").innerHTML = job?.plots?.residuals ? WBResults.convergencePane(ctx)
    : `<p class="empty">${job ? "No convergence data for this run." : "Select a run."}</p>`;
  $("force").innerHTML = job?.plots?.forces ? WBResults.forcePane(ctx)
    : `<p class="empty">${job ? "No force history for this run." : "Select a run."}</p>`;
  renderCompare();
}

const esc = (v) => String(v ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

// Up/Down walk the setup tree, Left/Right collapse and expand. Reaching the
// mesh settings should not require the mouse — and a tree without arrow keys is
// the sort of thing that only ever gets noticed by the person who cannot use a
// mouse that day.
document.addEventListener("keydown", (ev) => {
  if (!state.selSim || ev.metaKey || ev.ctrlKey || ev.altKey) return;
  const tag = (ev.target.tagName || "").toLowerCase();
  if (tag === "input" || tag === "select" || tag === "textarea") return;
  if (!["ArrowDown", "ArrowUp", "ArrowLeft", "ArrowRight"].includes(ev.key)) return;

  const nodes = [...document.querySelectorAll("#tree .row[data-node]")].map((e) => e.dataset.node);
  if (!nodes.length) return;
  const i = nodes.indexOf(state.selNode);

  if (ev.key === "ArrowDown" || ev.key === "ArrowUp") {
    const next = i < 0 ? 0 : Math.max(0, Math.min(nodes.length - 1, i + (ev.key === "ArrowDown" ? 1 : -1)));
    state.selNode = nodes[next];
  } else {
    // Collapse or expand the header this node sits under.
    const tree = WBPanels.tree(panelCtx());
    const idx = tree.findIndex((n) => n.id === state.selNode);
    const header = idx < 0 ? null
      : [...tree.slice(0, idx)].reverse().find((n) => n.kind === "header");
    if (!header) return;
    ev.key === "ArrowLeft" ? state.collapsed.add(header.id) : state.collapsed.delete(header.id);
  }
  ev.preventDefault();
  render();
  document.querySelector(`#tree .row[data-node="${state.selNode}"]`)
    ?.scrollIntoView({ block: "nearest" });
});

async function newProject() {
  const name = await ask({ title: "New project", input: "", ok: "Create" });
  if (!name) return;
  const { error } = await sb.from("projects").insert({ user_id: me.id, name });
  if (error) return toast(error.message);
  refresh();
}

// The geometry edit controls. They live in the host rather than in the panels
// module because applyEdit() reads them by id and the operation list they build
// is replayed on the B-rep, not on anything the setup document describes.
// Tag the panels' explanatory paragraphs so they can be collapsed as a group.
// Done here rather than in workbench-panels.js because it is a presentation
// decision about the column they land in, not about what each panel says: and
// tagging fifteen panels by hand is fifteen chances to miss one.
//
// A paragraph is prose if it carries no control and is longer than a label.
function markNotes(html) {
  const box = document.createElement("div");
  box.innerHTML = html;
  for (const p of box.querySelectorAll("p")) {
    if (p.querySelector("input,select,button,a")) continue;
    if (p.textContent.trim().length < 45) continue;
    if (p.classList.contains("err")) continue;      // errors are not notes
    p.classList.add("panel-note");
  }
  return box.innerHTML;
}

// Remembered, because a preference you have to set on every page load is not a
// preference. Falls back to shown if storage is unavailable (private mode).
function notesOn() {
  try { return localStorage.getItem("tf.notes") !== "off"; } catch (e) { return true; }
}
function applyNotes() {
  const on = notesOn();
  $("insp").classList.toggle("notes-off", !on);
  $("noteToggle")?.setAttribute("aria-pressed", String(on));
}
function toggleNotes() {
  try { localStorage.setItem("tf.notes", notesOn() ? "off" : "on"); } catch (e) {}
  applyNotes();
}

// Save writes both halves: the four columns the billing functions and the
// Fusion plugin already know about, and the setup document behind the manual
// panels. They go in one update so a case can never be half-saved.
async function saveSim(id) {
  const s = state.sims.find((x) => x.id === id);
  if (!s) return;
  const patch = {
    inlet_velocity: Math.max(1, Math.min(100, +s.inlet_velocity || 20)),
    refine_level: Math.max(1, Math.min(5, Math.round(+s.refine_level) || 3)),
    iteration_count: Math.max(1, Math.min(3000, Math.round(+s.iteration_count) || 1000)),
    debug_mesh: !!s.debug_mesh,
    updated_at: new Date().toISOString(),
  };
  if (state.draft && state.draftSim === id) patch.setup = state.draft;
  const { error } = await sb.from("simulations").update(patch).eq("id", id);
  if (error) return toast(error.message, 8000);
  state.draft = state.draftSim = null;
  toast("Setup saved.");
  refresh();
}

// How many edits deep this geometry sits. v1 is the upload.
function geometryVersion(g) {
  let n = 1, seen = new Set();
  while (g?.derived_from && !seen.has(g.id)) {
    seen.add(g.id);
    g = state.geoms.find((x) => x.id === g.derived_from);
    n++;
  }
  return n;
}

// Apply the edit to the CAD solid and branch: a new geometry version plus a
// simulation that points at it, so the previous version keeps its runs and you
// can compare v1 against v2 rather than overwriting the thing you measured.
async function applyEdit(simId) {
  const s = state.sims.find((x) => x.id === simId);
  const g = state.geoms.find((x) => x.id === s?.geometry_id);
  if (!g?.step_path) return toast("This simulation has no geometry.");

  const ops = [];
  const scale = +$("eScale").value, rot = +$("eRot").value, mirror = $("eMirror").value;
  const [dx, dy, dz] = ["eDx", "eDy", "eDz"].map((id) => +$(id).value || 0);
  if (scale && scale !== 1) ops.push({ type: "scale", factor: scale });
  if (rot) ops.push({ type: "rotate", axis: $("eRotAxis").value, degrees: rot });
  if (mirror) ops.push({ type: "mirror", axis: mirror });
  if (dx || dy || dz) ops.push({ type: "translate", dx, dy, dz });
  if (!ops.length) return toast("Nothing to change. Set a scale, rotation, mirror or move.");

  const btn = $("editBtn");
  btn.disabled = true; btn.textContent = "Editing…";
  try {
    const geomId = crypto.randomUUID();
    const { data: { session } } = await sb.auth.getSession();
    const r = await fetch(TESSELLATE_URL + "/transform", {
      method: "POST",
      headers: { "Content-Type": "application/json", Authorization: `Bearer ${session.access_token}` },
      body: JSON.stringify({ step_path: g.step_path, ops, dest_prefix: `jobs/${me.id}/${geomId}` }),
    });
    const out = await r.json();
    if (!r.ok) throw new Error(out.error || r.status);

    const version = geometryVersion(g) + 1;
    const { data: ng, error: ge } = await sb.from("geometries").insert({
      id: geomId, project_id: g.project_id, user_id: me.id,
      name: g.name.replace(/ v\d+$/, "") + ` v${version}`,
      step_path: out.step_path, glb_path: out.glb_path,
      triangle_count: out.triangle_count, bbox: out.bbox,
      face_count: g.face_count, solid_count: g.solid_count,
      // Carry the labels forward. A rigid transform or uniform scale does not
      // change which face is the inlet, and dropping this leaves v2 with no
      // boundary conditions at all — it would solve, and hand back a drag figure
      // the Compare tab would happily diff against v1's.
      label_path: g.label_path,
      derived_from: g.id, edit_ops: ops,
    }).select().single();
    if (ge) throw ge;

    const { data: ns, error: se } = await sb.from("simulations").insert({
      project_id: s.project_id, geometry_id: ng.id, user_id: me.id,
      name: s.name.replace(/ \(v\d+\)$/, "") + ` (v${version})`,
      inlet_velocity: s.inlet_velocity, refine_level: s.refine_level,
      iteration_count: s.iteration_count, debug_mesh: s.debug_mesh,
    }).select().single();
    if (se) throw se;

    state.selSim = ns.id; state.selJob = null;
    toast(`Saved as v${version}. Run it to compare against v${version - 1}.`);
    await refresh();
  } catch (e) {
    toast(e.message || String(e), 8000);
  } finally {
    btn.disabled = false;
  }
}

// The statuses refund_job will accept — anything before the solver has burned
// real SimScale time. Kept in step with the full_refund list in
// 0003_billing_functions.sql; offering the button for a status the server will
// refuse is worse than not offering it.
const REFUNDABLE = new Set(["draft", "pending", "downloading", "uploading_geometry",
                            "processing", "creating_simulation", "meshing"]);

async function cancelRun(jobId, cost) {
  if (!await ask({ title: "Cancel run?", body: `This refunds ${cost} credits.`, ok: "Cancel run" })) return;
  const { data, error } = await sb.functions.invoke("refund-job", { body: { job_id: jobId } });
  if (error || data?.error) {
    return toast("Could not cancel: " + (data?.error || error?.message || "unknown error"), 8000);
  }
  state.selJob = null;
  // data can be present but shapeless on an unexpected 2xx; guard the amount so a
  // successful cancel never throws a TypeError and swallows its own confirmation.
  toast(data?.refunded != null ? `Refunded ${data.refunded} credits.` : "Run cancelled.");
  refresh();
}

// Queue a run for an existing simulation, reusing its geometry.
async function runSim(id) {
  const s = state.sims.find((x) => x.id === id);
  const g = state.geoms.find((x) => x.id === s.geometry_id);
  if (!g?.step_path) return toast("This simulation has no geometry yet.");
  // Unsaved edits would otherwise run against the last saved case, which is the
  // one thing worse than not running at all: a result labelled with settings it
  // was not produced under.
  if (state.draft && state.draftSim === id) await saveSim(id);
  const { error } = await sb.from("jobs").insert({
    user_id: me.id, project_id: s.project_id, simulation_ref: s.id,
    status: "pending", file_name: g.name, step_path: g.step_path, label_path: g.label_path,
    iteration_count: s.iteration_count, refine_level: s.refine_level,
    inlet_velocity: s.inlet_velocity, debug_mesh: s.debug_mesh,
    setup_snapshot: setupOf(s),
    // What the solver divides its forces by to report a coefficient. Carried on
    // the job, not looked up later, so a run keeps the area it was solved with
    // even if the geometry row is edited afterwards.
    frontal_area_m2: g.frontal_area_m2 ?? null,
    reference_length_m: g.bbox?.size?.[0] ?? null,
  });
  toast(error ? error.message : "Run queued.");
  refresh();
}

// ── Automatic CFD: pick a STEP, upload, create the whole tree, queue the run ──
// Resolve on cancel as well as on choose. Dismissing the labels dialog is a
// normal outcome — it is asked for before the upload and the caller handles a
// null — so the
// expected path through this dialog is to dismiss it — and `change` does not
// fire when a file dialog is dismissed, which left Automatic CFD waiting on a
// promise that never settled and the button stuck on "Uploading…" until reload.
function pick(input) {
  return new Promise((res) => {
    let done = false;
    const finish = (v) => { if (!done) { done = true; res(v); } };
    input.value = "";                       // re-picking the same file must re-fire
    input.onchange = () => finish(input.files[0] || null);
    input.oncancel = () => finish(null);    // supported in current browsers
    // Fallback for browsers without `cancel`: the window regains focus when the
    // dialog closes either way, so settle shortly after if change never came.
    const onFocus = () => setTimeout(() => finish(input.files[0] || null), 400);
    window.addEventListener("focus", onFocus, { once: true });
    input.click();
  });
}

// -- preparing a raw car -----------------------------------------------------
// The Fusion add-in ships a finished flow region: a box with the car already
// cut out of it, plus the CSV naming every face. Here the user brings the car
// itself, so the box has to be built around it in the browser first. That is
// what this whole section is.
//
// state.prep holds everything the dialog needs and is the only thing the panel
// reads, so the box on screen and the numbers beside it cannot disagree.

async function svc(path, body) {
  const { data: { session } } = await sb.auth.getSession();
  const r = await fetch(TESSELLATE_URL + path, {
    method: "POST",
    headers: { "Content-Type": "application/json",
               Authorization: `Bearer ${session.access_token}` },
    body: JSON.stringify(body),
  });
  const out = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(out.error || `The geometry service returned ${r.status}.`);
  return out;
}

// The same rule the service uses, run here so changing the radius re-detects
// instantly instead of re-uploading and re-tessellating the car.
function detectWheels(faces, radiusM, tol) {
  const groups = [];
  for (const f of faces) {
    if (f.type !== "cylinder" || !f.axis) continue;
    if (Math.abs(Math.abs(f.axis[1]) - 1) > 0.05) continue;      // not about Y
    const r = f.radius_m;
    if (!(r >= radiusM * (1 - tol) && r <= radiusM * (1 + tol))) continue;
    const near = r * 0.5;
    let g = groups.find((q) => Math.abs(q.x - f.axis_x_m) < near
                            && Math.abs(q.z - f.axis_z_m) < near);
    if (!g) { g = { x: f.axis_x_m, z: f.axis_z_m, ys: [], radii: [], faces: [] }; groups.push(g); }
    g.ys.push(f.axis_y_m); g.radii.push(r); g.faces.push(f.index);
  }
  return groups.sort((a, b) => a.x - b.x || a.z - b.z).map((g, i) => ({
    name: `Wheel_${i + 1}`,
    radius_m: +Math.max(...g.radii).toFixed(6),
    cx_m: +g.x.toFixed(6),
    cy_m: +(g.ys.reduce((t, v) => t + v, 0) / g.ys.length).toFixed(6),
    cz_m: +g.z.toFixed(6),
    face_indices: g.faces.slice().sort((a, b) => a - b),
  }));
}

// build_domain in main.py, mirrored so the box can be redrawn on every
// keystroke without a round trip. The floor comes off the wheels, not the
// bodywork: a car sits on its contact patch and its lowest panel is above it.
function prepDomain() {
  const p = state.prep, lo = p.info.bbox.min, hi = p.info.bbox.max;
  const ground = p.wheels.length
    ? Math.min(...p.wheels.map((w) => w.cz_m - w.radius_m)) - 0.03
    : lo[2];
  return {
    outlet_x: lo[0] - p.off.down, inlet_x: hi[0] + p.off.up,
    ground_z: ground, top_z: hi[2] + p.off.top,
    side_y: lo[1] - p.off.side,
    symmetry_y: p.sym ? 0 : hi[1] + p.off.side,
    symmetry: p.sym,
  };
}

function prepDrawBox() {
  const p = state.prep;
  if (!p) return window.hideTunnel();
  const d = prepDomain(), inv = 1 / p.info.scale_to_m;
  window.showTunnel({
    x0: d.outlet_x * inv, x1: d.inlet_x * inv,
    y0: Math.min(d.side_y, d.symmetry_y) * inv,
    y1: Math.max(d.side_y, d.symmetry_y) * inv,
    z0: d.ground_z * inv, z1: d.top_z * inv,
  });
  window.setPickedFaces(p.wheels.flatMap((w) => w.face_indices));
}

const mm = (m) => (m * 1000).toFixed(1);

// The measured shadow, for whichever tunnel is currently set up. Shown live
// because it is what every force coefficient is divided by.
function frontalNow() {
  const p = state.prep;
  if (!p) return 0;
  return (p.sym ? p.info.frontal_area_half_m2 : p.info.frontal_area_m2) || 0;
}

function renderPrep() {
  const el = $("prepPanel"), p = state.prep;
  el.classList.toggle("hidden", !p);
  document.body.classList.toggle("preparing", !!p);
  document.querySelector(".viewport").classList.toggle("picking", !!p && p.picking);
  if (!p) return;
  const lo = p.info.bbox.min, hi = p.info.bbox.max, sz = p.info.bbox.size;
  const d = prepDomain();
  // A half car modelled about y = 0 with symmetry off puts a slip wall where
  // the other half should be and the answer means nothing. The width is the
  // only thing on screen that reveals it, so it is stated, not buried.
  const looksHalf = Math.abs(hi[1]) < 1e-4 || Math.abs(lo[1]) < 1e-4;
  const w = p.wheels;

  el.innerHTML = `
    <h3>Wind tunnel setup</h3>
    <div class="note">${esc(p.file.name)}<br>
      Car ${mm(sz[0])} by ${mm(sz[1])} by ${mm(sz[2])} mm,
      ${p.info.solid_count} bodies, ${p.info.face_count} faces, read as ${p.info.unit}.<br>
      Frontal area ${(frontalNow() * 1e4).toFixed(2)} cm&sup2;${p.sym ? ", half the car" : ""}.</div>
    ${looksHalf && !p.sym ? `<div class="warn">This car sits against y = 0, so it
      is probably half a car. With symmetry off the tunnel wraps a car with one
      side missing and the result will not mean anything.</div>` : ""}

    <div class="grp">
      <div class="row"><label>Symmetry plane at y = 0</label>
        <input type="checkbox" ${p.sym ? "checked" : ""}
               onchange="prepSet('sym', this.checked)"></div>
      <div class="note">Halves the tunnel and the solve time. Only correct for a
        car modelled as a half, or a whole car mirrored about y = 0.</div>
    </div>

    <div class="grp">
      <div class="row"><span class="eyebrow">Tunnel</span>
        <button class="btn" style="height:22px;padding:0 8px"
                onclick="window.frameTunnel()">Fit view</button></div>
      <div class="row"><label>Upstream (m)</label>
        <input type="number" step="0.05" min="0.05" max="50" value="${p.off.up}"
               onchange="prepSet('up', this.value)"></div>
      <div class="row"><label>Downstream (m)</label>
        <input type="number" step="0.05" min="0.05" max="50" value="${p.off.down}"
               onchange="prepSet('down', this.value)"></div>
      <div class="row"><label>Side (m)</label>
        <input type="number" step="0.05" min="0.01" max="10" value="${p.off.side}"
               onchange="prepSet('side', this.value)"></div>
      <div class="row"><label>Above (m)</label>
        <input type="number" step="0.05" min="0.01" max="10" value="${p.off.top}"
               onchange="prepSet('top', this.value)"></div>
      <div class="note">Drag any wall of the box to move it. The floor is fixed
        30 mm under the lowest wheel, at z = ${mm(d.ground_z)} mm, because the
        road has to sit under the contact patch.</div>
    </div>

    <div class="grp">
      <div class="row"><span class="eyebrow">Wind speed</span>
        <input type="number" step="0.5" min="1" max="120" value="${p.velocity}"
               onchange="prepSet('velocity', this.value)"></div>
      <div class="note">m/s. Each wheel turns at this speed divided by its own
        radius, so both update together.</div>
    </div>

    <div class="grp">
      <div class="row"><span class="eyebrow">Wheels</span>
        <span class="num muted">${w.length}</span></div>
      <div class="row"><label>Detect at radius (mm)</label>
        <input type="number" step="0.5" min="1" max="1000" value="${mm(p.radius)}"
               onchange="prepSet('radius', this.value / 1000)"></div>
      <button class="btn" onclick="prepAutoWheels()">Detect wheels again</button>
      ${w.map((x, i) => `
        <div class="wheel ${p.activeWheel === i ? "active" : ""}">
          <div class="row"><b>${esc(x.name)}</b>
            <button class="btn" style="height:20px;padding:0 6px"
                    onclick="prepDropWheel(${i})">Remove</button></div>
          <div class="row"><label>Radius (mm)</label>
            <input type="number" step="0.1" min="1" value="${mm(x.radius_m)}"
                   onchange="prepWheelRadius(${i}, this.value / 1000)"></div>
          <div class="note">${x.face_indices.length} face${x.face_indices.length === 1 ? "" : "s"},
            centre ${mm(x.cx_m)}, ${mm(x.cy_m)}, ${mm(x.cz_m)} mm.
            Turns at ${(p.velocity / x.radius_m).toFixed(0)} rad/s.</div>
          <button class="btn" onclick="prepPickMode(${i})">
            ${p.activeWheel === i && p.picking ? "Done picking" : "Pick faces"}</button>
        </div>`).join("")}
      <button class="btn" onclick="prepAddWheel()">Add a wheel by picking faces</button>
      ${p.picking ? `<div class="note">Click a face on the car to add or remove
        it from ${esc(w[p.activeWheel] ? w[p.activeWheel].name : "this wheel")}.
        A whole face highlights under the pointer before you click. Right-click
        to grow the selection across a smooth join, or to reach a face hidden
        behind another. Orbiting still works.</div>` : ""}
      ${w.length === 0 ? `<div class="warn">No wheels. Every surface will be a
        fixed wall and the wheels will not turn.</div>` : ""}
    </div>

    <div class="row" style="margin-top:auto;gap:var(--s2)">
      <button class="btn" onclick="prepCancel()">Cancel</button>
      <button class="btn btn-primary" id="prepGo" onclick="prepBuild()"
              ${p.busy ? "disabled" : ""}>${p.busy || "Build wind tunnel"}</button>
    </div>`;
}

function prepSet(key, value) {
  const p = state.prep;
  if (!p) return;
  if (key === "sym") p.sym = !!value;
  else if (key === "velocity") p.velocity = Math.max(1, Math.min(120, +value || 1));
  else if (key === "radius") p.radius = Math.max(0.001, Math.min(1, +value || 0.001));
  else p.off[key] = Math.max(0.01, Math.min(50, +value || 0.01));
  prepDrawBox(); renderPrep();
}

function prepAutoWheels() {
  const p = state.prep;
  p.wheels = detectWheels(p.info.faces, p.radius, 0.08);
  p.activeWheel = null; p.picking = false;
  toast(p.wheels.length ? `Found ${p.wheels.length} wheel${p.wheels.length === 1 ? "" : "s"}.`
                        : "No cylinders about the Y axis at that radius.");
  prepDrawBox(); renderPrep();
}

function prepAddWheel() {
  const p = state.prep;
  p.wheels.push({ name: `Wheel_${p.wheels.length + 1}`, radius_m: p.radius,
                  cx_m: 0, cy_m: 0, cz_m: 0, face_indices: [] });
  prepPickMode(p.wheels.length - 1);
}

function prepDropWheel(i) {
  const p = state.prep;
  p.wheels.splice(i, 1);
  if (p.activeWheel === i) { p.activeWheel = null; p.picking = false; }
  prepDrawBox(); renderPrep();
}

function prepWheelRadius(i, r) {
  const p = state.prep;
  p.wheels[i].radius_m = Math.max(0.001, Math.min(1, +r || 0.001));
  renderPrep();
}

function prepPickMode(i) {
  const p = state.prep;
  p.picking = !(p.activeWheel === i && p.picking);
  p.activeWheel = p.picking ? i : null;
  renderPrep();
}

// A clicked face joins the wheel, or leaves it if it was already in. The centre
// and radius are recomputed from whatever faces the wheel now holds, so picking
// the two halves of a split tyre gives one wheel in the right place.
// Expand a single clicked face into whatever the current selection mode
// means. Kept separate from the picking itself so the modes cannot drift
// apart from the menu commands that do the same job on demand.
function facesForClick(faceId) {
  const p = state.prep;
  const mode = window.selectionMode || "face";
  if (!p || mode === "face") return [faceId];

  if (mode === "body") {
    const owner = (p.info.faces[faceId] || {}).solid;
    if (owner == null || owner < 0) {
      toast("This model does not say which part that face belongs to.");
      return [faceId];
    }
    return p.info.faces.filter((f) => f.solid === owner).map((f) => f.index);
  }

  // tangent: the face, and everything reachable from it over smooth edges
  const seen = new Set([faceId]), stack = [faceId];
  while (stack.length) {
    for (const n of (p.info.faces[stack.pop()] || {}).tangent || []) {
      if (!seen.has(n)) { seen.add(n); stack.push(n); }
    }
  }
  return [...seen];
}

function prepPickFace(faceId) {
  const p = state.prep, w = p.wheels[p.activeWheel];
  if (!w) return;
  const at = w.face_indices.indexOf(faceId);
  if (at >= 0) w.face_indices.splice(at, 1);
  else w.face_indices.push(faceId);
  w.face_indices.sort((a, b) => a - b);
  prepRecomputeWheel(w);
  prepDrawBox(); renderPrep();
}

// A wheel is whatever faces it holds. Recomputed from them every time, so
// adding the second half of a split tyre moves the centre to where it belongs
// rather than leaving it on the first half.
function prepRecomputeWheel(w) {
  const p = state.prep;
  const cyls = w.face_indices.map((i) => p.info.faces[i])
    .filter((f) => f && f.type === "cylinder" && f.axis);
  if (cyls.length) {
    w.radius_m = +Math.max(...cyls.map((f) => f.radius_m)).toFixed(6);
    w.cx_m = +(cyls.reduce((t, f) => t + f.axis_x_m, 0) / cyls.length).toFixed(6);
    w.cy_m = +(cyls.reduce((t, f) => t + f.axis_y_m, 0) / cyls.length).toFixed(6);
    w.cz_m = +(cyls.reduce((t, f) => t + f.axis_z_m, 0) / cyls.length).toFixed(6);
  } else if (w.face_indices.length) {
    // Flat or splined faces carry no radius of their own, so the centre is the
    // best that can be had and the radius stays whatever was typed.
    const fs = w.face_indices.map((i) => p.info.faces[i]).filter(Boolean);
    w.cx_m = +(fs.reduce((t, f) => t + f.cx_m, 0) / fs.length).toFixed(6);
    w.cy_m = +(fs.reduce((t, f) => t + f.cy_m, 0) / fs.length).toFixed(6);
    w.cz_m = +(fs.reduce((t, f) => t + f.cz_m, 0) / fs.length).toFixed(6);
  }
}

// -- growing a selection ------------------------------------------------------
// SimScale's "expand selection", which exists because a person and a STEP file
// disagree about what one face is. A tyre drawn as four trimmed cylinders is
// one thing to click on and four things in the file.

function prepActive() {
  const p = state.prep;
  return p && p.activeWheel != null ? p.wheels[p.activeWheel] : null;
}

// Faces reachable from the current selection over smooth joins. The tangency
// comes from the geometry service, because only OCC can tell a smooth edge from
// a sharp one, and most STEP files do not record it.
function prepExpandTangent() {
  const p = state.prep, w = prepActive();
  if (!w) return;
  const seen = new Set(w.face_indices), stack = [...w.face_indices];
  while (stack.length) {
    for (const n of (p.info.faces[stack.pop()] || {}).tangent || []) {
      if (!seen.has(n)) { seen.add(n); stack.push(n); }
    }
  }
  const added = seen.size - w.face_indices.length;
  prepSetFaces(w, [...seen]);
  toast(added ? `Added ${added} tangent face${added === 1 ? "" : "s"}.`
              : "Nothing joins this smoothly. It is already one whole face.");
}

// Split a pile of faces into wheels by where they sit. Same rule as detection:
// two faces belong to one wheel only if they are within half a radius of each
// other across the car.
function prepGroupFaces(ids) {
  const p = state.prep, groups = [];
  for (const i of ids) {
    const f = p.info.faces[i];
    if (!f) continue;
    const x = f.axis_x_m != null ? f.axis_x_m : f.cx_m;
    const z = f.axis_z_m != null ? f.axis_z_m : f.cz_m;
    const near = (f.radius_m || 0.02) * 0.5;
    let g = groups.find((q) => Math.abs(q.x - x) < near && Math.abs(q.z - z) < near);
    if (!g) { g = { x, z, faces: [] }; groups.push(g); }
    g.faces.push(i);
  }
  return groups.map((g) => g.faces.sort((a, b) => a - b));
}

// Faces the same size as the ones already chosen, which on a car is how you get
// the other wheels once you have one.
//
// They become separate wheels, not more faces of this one. Every wheel turns
// about its own centre, and pouring both wheels into one entity puts that
// centre midway between them, on a wheel that does not exist. That is the
// difference between this and SimScale's version of the same command: there a
// face set is a face set, here each set has to be one physical wheel.
function prepExpandSameArea() {
  const p = state.prep, w = prepActive();
  if (!w || !w.face_indices.length) return;
  const want = w.face_indices.map((i) => p.info.faces[i].area_m2);
  const all = new Set(w.face_indices);
  for (const f of p.info.faces) {
    if (all.has(f.index)) continue;
    // Within a percent. Equal faces in a CAD model are equal to the last
    // decimal, so this is only loose enough to survive the export.
    if (want.some((a) => a > 0 && Math.abs(f.area_m2 - a) / a < 0.01)) all.add(f.index);
  }
  if (all.size === w.face_indices.length) return toast("No other face is that size.");

  const groups = prepGroupFaces([...all]);
  const mine = groups.find((g) => g.some((i) => w.face_indices.includes(i))) || groups[0];
  const others = groups.filter((g) => g !== mine);
  prepSetFaces(w, mine);
  for (const g of others) {
    const extra = { name: `Wheel_${p.wheels.length + 1}`, radius_m: p.radius,
                    cx_m: 0, cy_m: 0, cz_m: 0, face_indices: g };
    p.wheels.push(extra);
    prepRecomputeWheel(extra);
  }
  prepDrawBox(); renderPrep();
  toast(others.length
    ? `Found ${others.length} more wheel${others.length === 1 ? "" : "s"} the same size.`
    : `Added ${mine.length - 1} more face${mine.length === 2 ? "" : "s"} to this wheel.`);
}

function prepSetFaces(w, ids) {
  w.face_indices = [...new Set(ids)].sort((a, b) => a - b);
  prepRecomputeWheel(w);
  prepDrawBox(); renderPrep();
}

// -- the right-click menu -----------------------------------------------------
let faceMenuAt = null;

function prepFaceMenu(ev) {
  const p = state.prep;
  const el = $("faceMenu");
  if (!p || !p.picking) return prepCloseMenu();
  const under = window.facesUnderPointer(ev.clientX, ev.clientY);
  const w = prepActive();
  if (!w) return prepCloseMenu();
  faceMenuAt = under;

  const vp = document.querySelector(".viewport").getBoundingClientRect();
  el.innerHTML = `
    <span class="eyebrow">Expand selection</span>
    <button onclick="prepMenuAct('tangent')" ${w.face_indices.length ? "" : "disabled"}>
      Tangent faces</button>
    <button onclick="prepMenuAct('area')" ${w.face_indices.length ? "" : "disabled"}>
      Faces of the same size</button>
    <hr>
    <span class="eyebrow">Select other</span>
    ${under.length ? under.map((id) => `
      <button onclick="prepMenuAct('face', ${id})">
        ${w.face_indices.includes(id) ? "Remove" : "Add"} face ${id}
        (${esc(p.info.faces[id] ? p.info.faces[id].type : "?")})</button>`).join("")
      : `<button disabled>Nothing under the pointer</button>`}
    <hr>
    <button onclick="prepMenuAct('clear')" ${w.face_indices.length ? "" : "disabled"}>
      Clear this wheel</button>`;
  el.classList.remove("hidden");
  // Kept inside the viewport, so a right-click near the bottom edge does not
  // open a menu that runs off the screen.
  const mx = Math.min(ev.clientX - vp.left, vp.width - el.offsetWidth - 8);
  const my = Math.min(ev.clientY - vp.top, vp.height - el.offsetHeight - 8);
  el.style.left = Math.max(0, mx) + "px";
  el.style.top = Math.max(0, my) + "px";
}

function prepCloseMenu() {
  $("faceMenu").classList.add("hidden");
  faceMenuAt = null;
}

function prepMenuAct(what, id) {
  const w = prepActive();
  prepCloseMenu();
  if (!w) return;
  if (what === "tangent") prepExpandTangent();
  else if (what === "area") prepExpandSameArea();
  else if (what === "clear") prepSetFaces(w, []);
  else if (what === "face") prepPickFace(id);
}

// Dragging a wall turns straight back into the offset that produced it, so the
// panel and the box are always the same numbers. The floor is not draggable: it
// is fixed under the wheels and moving it would put the road through them.
function prepWallMoved(key, valueModelUnits) {
  const p = state.prep, m = valueModelUnits * p.info.scale_to_m;
  const lo = p.info.bbox.min, hi = p.info.bbox.max;
  // To the millimetre. A drag lands on an arbitrary float, and a tunnel quoted
  // as 1.48626 m reads like a measurement rather than a choice.
  const set = (lowest, v) => Math.round(Math.max(lowest, v) * 1000) / 1000;
  if (key === "x1") p.off.up = set(0.05, m - hi[0]);
  else if (key === "x0") p.off.down = set(0.05, lo[0] - m);
  else if (key === "z1") p.off.top = set(0.01, m - hi[2]);
  else if (key === "y0") p.off.side = set(0.01, lo[1] - m);
  else if (key === "y1" && !p.sym) p.off.side = set(0.01, m - hi[1]);
  else return false;
  prepDrawBox();
  return true;
}

function prepCancel() {
  const p = state.prep;
  state.prep = null;
  window.hideTunnel();
  window.setPickedFaces([]);
  renderPrep();
  // The raw upload is the user's file and nothing else points at it, so it goes
  // with the dialog rather than sitting in a bucket nobody will ever clean.
  if (p && !p.built) sb.storage.from("cfd-files").remove([`${p.base}/raw.step`]).catch(() => {});
  showModel();
}

async function startPrepare() {
  const btn = $("autoBtn");
  try {
    const step = await pick($("stepInput"));
    if (!step) return;
    btn.disabled = true; btn.textContent = "Uploading...";

    const gid = crypto.randomUUID();
    const base = `users/${me.id}/geometries/${gid}`;
    const up = await sb.storage.from("cfd-files").upload(`${base}/raw.step`, step, { upsert: false });
    if (up.error) throw up.error;

    btn.textContent = "Reading the car...";
    const info = await svc("/inspect", { step_path: `${base}/raw.step`, wheel_radius_m: 0.014125 });

    state.prep = {
      gid, base, file: step, info,
      sym: true, off: { up: 1.5, down: 0.5, side: 0.3, top: 0.3 },
      radius: 0.014125, velocity: 20,
      wheels: (info.wheels || []).map((w) => ({ ...w })),
      activeWheel: null, picking: false, busy: null, built: false,
    };
    await window.renderGlb(await signed(info.glb_path));
    prepDrawBox();
    window.frameTunnel();
    renderPrep();
  } catch (e) {
    toast(e.message || String(e), 8000);
  } finally {
    btn.disabled = false; btn.textContent = "Automatic CFD";
  }
}

// Build the flow region, then create the rows. Nothing is charged until the job
// row goes in, so a tunnel that comes back wrong costs nothing and can be
// adjusted and rebuilt.
async function prepBuild() {
  const p = state.prep;
  if (!p) return;
  if (!p.wheels.length) {
    const go = await ask({
      title: "No wheels marked",
      body: "Every surface on the car will be a fixed wall. Real wheels turn, "
          + "and a stationary wheel changes the wake and the drag.\n\n"
          + "Pick the wheel faces, or run it this way on purpose.",
      ok: "Run without turning wheels",
    });
    if (!go) return;
  }
  p.busy = "Building..."; renderPrep();
  let out;
  try {
    out = await svc("/prepare", {
      step_path: `${p.base}/raw.step`, dest_prefix: p.base,
      upstream_m: p.off.up, downstream_m: p.off.down,
      side_m: p.off.side, top_m: p.off.top, symmetry: p.sym,
      wheel_radius_m: p.radius,
      wheels: p.wheels.length ? p.wheels.map((w) => ({
        name: w.name, radius_m: w.radius_m,
        cx_m: w.cx_m, cy_m: w.cy_m, cz_m: w.cz_m, face_indices: w.face_indices,
      })) : undefined,
    });
  } catch (e) {
    p.busy = null; renderPrep();
    return toast(e.message || String(e), 12000);
  }

  // What the run will actually solve, before it is paid for. A tunnel with no
  // inlet finishes cleanly and means nothing, and the counts are the only place
  // that shows up.
  const c = out.label_counts || {};
  const lines = Object.keys(c).sort().map((k) => `${k}: ${c[k]}`).join("\n");
  const go = await ask({
    title: "Wind tunnel built",
    body: `${out.face_count} faces on the flow region:\n\n${lines}\n\n`
        + (out.missing_labels && out.missing_labels.length
            ? `Missing: ${out.missing_labels.join(", ")}. This run would not mean anything.\n\n`
            : "")
        + (out.demoted_wheel_faces
            ? `${out.demoted_wheel_faces} wheel faces had no usable radius and are plain walls.\n\n`
            : "")
        + "Queueing the run charges credits.",
    ok: "Queue the run",
  });
  if (!go) { p.busy = null; renderPrep(); return; }

  p.busy = "Queueing..."; renderPrep();
  try {
    const stamp = new Date().toLocaleString();
    const { data: proj, error: pe } = await sb.from("projects")
      .insert({ user_id: me.id, name: p.file.name.replace(/\.(step|stp)$/i, "") || "Wind tunnel" })
      .select().single();
    if (pe) throw pe;

    const { data: geom, error: ge } = await sb.from("geometries").insert({
      id: p.gid, project_id: proj.id, user_id: me.id, name: p.file.name,
      size_bytes: p.file.size, step_path: out.step_path, label_path: out.label_path,
      glb_path: out.glb_path, face_count: out.face_count,
      solid_count: out.solid_count, triangle_count: out.triangle_count,
      wheel_count: p.wheels.length,
      // The shadow the car casts into this tunnel. Force coefficients divide by
      // it, and before this it was a bounding box times a factor nobody could
      // defend, so every Cd the Workbench has ever shown was a guess.
      frontal_area_m2: out.frontal_area_m2, bbox: out.bbox,
      // Which route built this. A Fusion upload and a tunnel built here are not
      // interchangeable, and without the flag nothing downstream can tell.
      prepared_by: "workbench", source_step_path: `${p.base}/raw.step`,
    }).select().single();
    if (ge) throw ge;

    const { data: sim, error: se } = await sb.from("simulations").insert({
      project_id: proj.id, geometry_id: geom.id, user_id: me.id,
      name: `Wind tunnel, ${stamp}`, inlet_velocity: p.velocity,
    }).select().single();
    if (se) throw se;

    const { error: je } = await sb.from("jobs").insert({
      id: crypto.randomUUID(), user_id: me.id, project_id: proj.id,
      simulation_ref: sim.id, status: "pending", file_name: p.file.name,
      step_path: geom.step_path, label_path: geom.label_path,
      iteration_count: sim.iteration_count, refine_level: sim.refine_level,
      inlet_velocity: sim.inlet_velocity, debug_mesh: sim.debug_mesh,
      setup_snapshot: setupOf(sim),
      frontal_area_m2: out.frontal_area_m2 ?? null,
      reference_length_m: p.info.bbox.size[0],
    });
    if (je) throw je;

    p.built = true;
    state.selSim = sim.id;
    state.prep = null;
    window.hideTunnel();
    renderPrep();
    toast("Run queued, status updates here live.");
    await refresh();
  } catch (e) {
    p.busy = null; renderPrep();
    toast(e.message || String(e), 8000);
  }
}

async function autoCfd() {
  const btn = $("autoBtn");
  const uploaded = [];
  // Once the job row exists, on-new-job has charged credits and queued the
  // worker against the uploaded paths: so a later throw must NOT delete them.
  // Cleanup is for the pre-commit window only; after it, a failed refresh() is
  // cosmetic and the paid run still needs its geometry.
  let committed = false;
  try {
    const step = await pick($("stepInput"));
    if (!step) return;

    // The labels CSV. Asked for BEFORE anything is uploaded, because automatic
    // labelling does not currently work (FINDINGS.md 11 , /infer_labels cannot
    // recover STEP entity ids) and without it the run has no boundary
    // conditions at all. Uploading two megabytes first, calling an endpoint we
    // know will refuse, and then deleting the upload is a slower way of
    // arriving at the same place.
    const labels = await pick($("labelInput"));
    if (!labels) {
      const go = await ask({
        title: "No entity_labels.csv chosen",
        body: "That file says which faces are the inlet, outlet, ground and car. "
          + "Without it the run has no boundary conditions.\n\n"
          + "The service can try to derive it from the STEP, but that currently "
          + "fails on most files (FINDINGS.md 11). If it does, nothing is "
          + "uploaded or charged and you will be asked for the CSV again.\n\n"
          + "The Fusion 360 plugin exports it alongside the STEP.",
        ok: "Try anyway",
      });
      if (!go) return;
    }

    btn.disabled = true; btn.textContent = "Uploading…";
    const jobId = crypto.randomUUID();
    // Geometry is keyed by the GEOMETRY, not by the first run that used it. A
    // simulation can be run repeatedly against one upload, and the worker
    // deletes its own job folder when it finishes , parking the STEP under a
    // job id meant run 2 downloaded a file run 1 had already cleaned up.
    // RLS only requires the jobs/<uid>/ prefix, so the second segment is ours.
    const geomId = crypto.randomUUID();
    const base = `users/${me.id}/geometries/${geomId}`;  // the uid in the path IS the
                                                     // ownership check (storage.rules)

    let up = await sb.storage.from("cfd-files").upload(`${base}/geometry.step`, step, { upsert: false });
    if (up.error) throw up.error;
    uploaded.push(`${base}/geometry.step`);
    if (labels) {
      up = await sb.storage.from("cfd-files").upload(`${base}/entity_labels.csv`, labels, { upsert: false });
      if (up.error) throw up.error;
      uploaded.push(`${base}/entity_labels.csv`);
    }

    // Best-effort labelling, attempted only after the user opted in above. It
    // usually fails today (FINDINGS.md 11), so the point of running it here —
    // before the job row exists — is that the failure costs nothing: on-new-job
    // charges at insert time, so a run that cannot work must never reach it.
    let labelPath = labels ? `${base}/entity_labels.csv` : null;
    if (!labels) {
      btn.textContent = "Labelling faces…";
      labelPath = await inferLabels(`${base}/geometry.step`, `${base}/entity_labels.csv`);
      if (!labelPath) {
        await sb.storage.from("cfd-files").remove(uploaded);
        return;                      // toast already explains why
      }
      uploaded.push(labelPath);
    }

    btn.textContent = "Setting up…";
    const stamp = new Date().toLocaleString();
    const { data: proj, error: pe } = await sb.from("projects")
      .insert({ user_id: me.id, name: step.name.replace(/\.(step|stp)$/i, "") || "Automatic CFD" })
      .select().single();
    if (pe) throw pe;

    const { data: geom, error: ge } = await sb.from("geometries").insert({
      id: geomId, project_id: proj.id, user_id: me.id, name: step.name, size_bytes: step.size,
      step_path: `${base}/geometry.step`, label_path: labelPath,
    }).select().single();
    if (ge) throw ge;

    const { data: sim, error: se } = await sb.from("simulations").insert({
      project_id: proj.id, geometry_id: geom.id, user_id: me.id,
      name: `Automatic CFD, ${stamp}`,
    }).select().single();
    if (se) throw se;

    // status 'pending' is what on-new-job acts on: it re-clamps every value
    // server-side, charges credits, and starts the Cloud Run worker.
    const { error: je } = await sb.from("jobs").insert({
      id: jobId, user_id: me.id, project_id: proj.id, simulation_ref: sim.id,
      status: "pending", file_name: step.name,
      step_path: geom.step_path, label_path: geom.label_path,
      iteration_count: sim.iteration_count, refine_level: sim.refine_level,
      inlet_velocity: sim.inlet_velocity, debug_mesh: sim.debug_mesh,
      // The first run of a simulation needs its snapshot as much as any later
      // one — leaving it null here is what makes a later setup edit silently
      // relabel the very first result in the project.
      setup_snapshot: setupOf(sim),
    });
    if (je) throw je;
    committed = true;   // point of no return: charged and queued

    state.selSim = sim.id; state.selJob = jobId;
    toast("Run queued, status updates here live.");
    await refresh();
    btn.textContent = "Tessellating…";
    await tessellate(geom.id, geom.step_path);   // 3D preview, best effort
  } catch (e) {
    toast(e.message || String(e), 8000);
    // Do not leave the upload orphaned: nothing else will ever clean it up, and
    // the free tier is 1 GB. But never delete a committed job's geometry — the
    // worker is already queued to download exactly these paths.
    if (uploaded.length && !committed) await sb.storage.from("cfd-files").remove(uploaded);
  } finally {
    btn.disabled = false; btn.textContent = "Automatic CFD";
  }
}

// Inspect clicks land on the viewport, not the canvas, so a pin's own label can
// sit above the canvas and still be clickable to remove it.
viewerReady.then(() => {
  const vp = document.querySelector(".viewport");

  // Dragging a tunnel wall. Taken on pointerdown so the orbit controls can be
  // switched off before they see the same drag and spin the camera instead.
  let dragged = false;
  vp.addEventListener("pointerdown", (ev) => {
    if (!state.prep || ev.button !== 0 || ev.target.closest(".prep")) return;
    if (!window.startTunnelDrag(ev.clientX, ev.clientY)) return;
    dragged = false;
    vp.setPointerCapture?.(ev.pointerId);
    vp.classList.add("walldrag");
  });
  vp.addEventListener("pointermove", (ev) => {
    if (!state.prep) return;
    const moved = window.moveTunnelDrag(ev.clientX, ev.clientY);
    if (!moved) return;
    dragged = true;
    // Redrawing from the offset rather than from the wall position is what
    // keeps the panel honest: the box is always what the numbers say.
    if (prepWallMoved(moved.key, moved.value)) renderPrep();
  });
  const endDrag = (ev) => {
    if (!state.prep) return;
    window.endTunnelDrag();
    vp.releasePointerCapture?.(ev.pointerId);
    vp.classList.remove("walldrag");
  };
  vp.addEventListener("pointerup", endDrag);
  vp.addEventListener("pointercancel", endDrag);

  // Highlight the whole face under the pointer before it is clicked. Without
  // it there is no way to tell what a click is about to select, and a triangle
  // and a face look identical until one of them lights up.
  let hoverQueued = false, hoverAt = null, hovered = -1;
  vp.addEventListener("pointermove", (ev) => {
    if (!state.prep || !state.prep.picking) {
      if (hovered !== -1) { hovered = window.selectFace(-1); }
      return;
    }
    hoverAt = [ev.clientX, ev.clientY];
    if (hoverQueued) return;
    hoverQueued = true;
    requestAnimationFrame(() => {
      hoverQueued = false;
      const hit = window.inspectAt(hoverAt[0], hoverAt[1]);
      const id = hit && hit.faceId != null ? hit.faceId : -1;
      if (id !== hovered) hovered = window.selectFace(id);
    });
  });

  vp.addEventListener("contextmenu", (ev) => {
    if (!state.prep || !state.prep.picking || ev.target.closest(".prep")) return;
    ev.preventDefault();
    prepFaceMenu(ev);
  });
  vp.addEventListener("pointerdown", (ev) => {
    if (!ev.target.closest(".facemenu")) prepCloseMenu();
  });

  vp.addEventListener("click", (ev) => {
    if (ev.target.closest(".pin")) return;      // removing a pin, not adding one
    if (ev.target.closest(".prep")) return;     // a control, not the model
    // Picking wheel faces. A click that was really the end of an orbit or a
    // wall drag must not also select a face.
    if (state.prep) {
      if (dragged) { dragged = false; return; }
      if (!state.prep.picking) return;
      const hit = window.inspectAt(ev.clientX, ev.clientY);
      if (!hit || hit.faceId == null) return toast("No face there. Click on the car.");
      // What one click means, per the Controls panel. Face is one face; body
      // is every face of the part, which is what someone means when they
      // point at a wheel; tangent grows across smooth joins.
      const ids = facesForClick(hit.faceId);
      ids.forEach(prepPickFace);
      return;
    }
    addPin(ev);
  });
  window.onCameraChange(drawPins);
  addEventListener("resize", drawPins);
});

// ── stale-build detection ────────────────────────────────────────────────────
// A browser tab left open does not know the file behind it has changed, and
// nothing about the page tells you which build you are looking at. That cost
// real time during development: work was reviewed against a tab hours out of
// date, repeatedly, with no way to tell from the screen.
//
// So the page asks. It records the Last-Modified it was served with, re-checks
// periodically, and shows a chip when the server has something newer. It never
// reloads on its own — losing a half-filled setup panel to a background refresh
// would be a worse bug than the one this solves.
(function watchForNewBuild() {
  const url = location.pathname;
  let loadedVersion = null;

  const version = async () => {
    try {
      const r = await fetch(url, { method: "HEAD", cache: "no-store" });
      return r.headers.get("last-modified") || r.headers.get("etag");
    } catch (e) {
      return null;                      // offline or server down: say nothing
    }
  };

  version().then((v) => {
    loadedVersion = v;
    if (!v) return;                     // no usable header, so no claim to make
    setInterval(async () => {
      const now = await version();
      if (now && now !== loadedVersion) $("stale").classList.remove("hidden");
    }, 20000);
  });
})();

sb.auth.onAuthStateChange((event) => {
  if (event === "SIGNED_OUT") return location.reload();
  boot();
});
boot();
</script>
</body>
</html>
