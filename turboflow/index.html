<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#141414" media="(prefers-color-scheme: dark)" />
  <meta name="theme-color" content="#f4f2ee" media="(prefers-color-scheme: light)" />
  <title>TurboFlow | STEM Racing CFD</title>
  <!-- SVG first: browsers that support it get a mark that stays sharp at any
       size, and the PNGs below stay as the fallback. -->
  <link rel="icon" href="/icon.svg" type="image/svg+xml" />
  <link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png" />
  <link rel="icon" href="/icon-192.png" sizes="192x192" type="image/png" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" sizes="180x180" />
  <link rel="canonical" href="https://turboflow-test.web.app/" />

  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="TurboFlow" />
  <meta property="og:title" content="TurboFlow | STEM Racing CFD" />
  <meta property="og:description" content="Cloud CFD for F1 in Schools and STEM Racing teams. Upload from Fusion 360 and get drag, lift and predicted race time." />
  <meta property="og:url" content="https://turboflow-test.web.app/" />
  <meta property="og:image" content="https://turboflow-test.web.app/og-image.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:image:alt" content="The TurboFlow dashboard, showing the simulation list and credit balance." />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="description" content="Cloud CFD for F1 in Schools and STEM Racing teams. Upload from Fusion 360 and get drag, lift and predicted race time." />

  <!-- Structured data. Absolute URLs because a consumer may have the JSON
       without the page it came from; the one origin here is the same one the
       canonical tags use. -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@graph": [
      {
        "@type": "Organization",
        "@id": "https://turboflow-test.web.app/#organization",
        "name": "TurboFlow",
        "url": "https://turboflow-test.web.app/",
        "logo": "https://turboflow-test.web.app/icon-192.png",
        "description": "Cloud CFD for F1 in Schools and STEM Racing teams.",
        "sameAs": ["https://www.instagram.com/turboflow.cfd"],
        "contactPoint": {
          "@type": "ContactPoint",
          "contactType": "customer support",
          "email": "support@turboflow.cloud",
          "availableLanguage": "English"
        }
      },
      {
        "@type": "WebSite",
        "@id": "https://turboflow-test.web.app/#website",
        "name": "TurboFlow",
        "url": "https://turboflow-test.web.app/",
        "inLanguage": "en",
        "publisher": { "@id": "https://turboflow-test.web.app/#organization" }
      }
    ]
  }
  </script>

  <!-- Fonts are the only render-blocking request left. preconnect opens the
       connections while the HTML is still parsing, and display=swap means text
       is readable before the webfont arrives rather than after. -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700&family=IBM+Plex+Mono:wght@400;600&display=swap" />

  <!-- Which Firebase project this build talks to. Deliberately unbundled, so
       switching between test and production is a file swap, not a rebuild. -->
  <script src="/firebase-config.js"></script>
  <script>
    // Theme, before first paint. An explicit choice wins over the OS; with no
    // choice stored, nothing is stamped and the CSS follows prefers-color-scheme.
    try {
      var t = localStorage.getItem("turboflow-theme");
      if (t === "light" || t === "dark") document.documentElement.dataset.theme = t;
    } catch (e) {}
  </script>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/entries/index.jsx"></script>
</body>
</html>
