apiVersion: run.googleapis.com/v1
kind: Job
metadata:
  labels:
    cloud.googleapis.com/location: us-central1
  name: simscale-worker
  namespace: '659747979647'
spec:
  template:
    metadata:
      annotations:
        run.googleapis.com/execution-environment: gen2
      labels:
    spec:
      taskCount: 1
      template:
        spec:
          containers:
          - env:
            - name: SIMSCALE_PROJECT_ID
              value: '3955117048594207313'
            - name: STORAGE_BUCKET
              value: turboflow-7b3ca.firebasestorage.app
            - name: MAX_RUN_SECONDS
              value: '21600'
            - name: MAX_PACKAGE_BYTES
              value: '3221225472'
            - name: SIMSCALE_API_KEY
              valueFrom:
                secretKeyRef:
                  key: latest
                  name: SIMSCALE_API_KEY
            image: gcr.io/turboflow-7b3ca/simscale-worker:v25
            resources:
              limits:
                cpu: '2'
                memory: 8Gi
          maxRetries: 0
          serviceAccountName: tf-worker@turboflow-7b3ca.iam.gserviceaccount.com
          timeoutSeconds: '25200'
