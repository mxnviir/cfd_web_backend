apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  annotations:
    run.googleapis.com/ingress: all
  labels:
    cloud.googleapis.com/location: us-central1
  name: turboflow-geometry
  namespace: '659747979647'
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/maxScale: '3'
        autoscaling.knative.dev/minScale: '0'
        run.googleapis.com/startup-cpu-boost: 'true'
      labels:
        run.googleapis.com/startupProbeType: Default
    spec:
      containerConcurrency: 160
      containers:
      - env:
        - name: GCP_PROJECT_NUMBER
          value: '659747979647'
        - name: STORAGE_BUCKET
          value: turboflow-7b3ca.firebasestorage.app
        image: gcr.io/turboflow-7b3ca/turboflow-geometry:v65
        ports:
        - containerPort: 8080
          name: http1
        resources:
          limits:
            cpu: '4'
            memory: 8Gi
        startupProbe:
          failureThreshold: 1
          periodSeconds: 240
          tcpSocket:
            port: 8080
          timeoutSeconds: 240
      serviceAccountName: tf-geometry@turboflow-7b3ca.iam.gserviceaccount.com
      timeoutSeconds: 600
  traffic:
  - latestRevision: true
    percent: 100
