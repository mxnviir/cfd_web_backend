<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#141414" media="(prefers-color-scheme: dark)" />
  <meta name="theme-color" content="#f4f2ee" media="(prefers-color-scheme: light)" />
  <title>Workbench | TurboFlow</title>
  <link rel="icon" href="/icon.svg" type="image/svg+xml" />
  <link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" sizes="180x180" />

  <!-- Not indexable: every URL under /workbench belongs to one signed-in
       user's project, and a search result for one would be a dead link for
       everybody else. -->
  <meta name="robots" content="noindex, nofollow" />
  <meta name="description" content="Set up and run a CFD simulation on your car." />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;600&display=swap" />

  <!-- Which Firebase project this build talks to. Deliberately unbundled, so
       switching between test and production is a file swap, not a rebuild. -->
  <script src="/supabase-config.js"></script>
</head>
<body>
  <!-- No theme boot script here, unlike every other page. The Workbench is
       white in both themes on purpose: a pressure field rendered against a
       dark ground is a different picture, and a team's portfolio screenshot
       should not depend on a setting. -->
  <div id="root"></div>
  <script type="module" src="/src/entries/workbench.jsx"></script>
</body>
</html>
