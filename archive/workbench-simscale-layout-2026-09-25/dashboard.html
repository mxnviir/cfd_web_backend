<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard | TurboFlow</title>
  <!-- SVG first: browsers that support it get a mark that stays sharp at any
       size, and the PNGs below stay as the fallback. -->
  <link rel="icon" href="/icon.svg" type="image/svg+xml" />
  <link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png" />
  <link rel="icon" href="/icon-192.png" sizes="192x192" type="image/png" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" sizes="180x180" />
  <link rel="canonical" href="https://turboflow-test.web.app/dashboard" />

  <!-- A signed-in screen. Everything on it comes from a Firestore read that
       needs a session, so a crawler sees a heading above an empty panel.
       `follow` because the site navigation on it is worth following. -->
  <meta name="robots" content="noindex, follow" />

  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="TurboFlow" />
  <meta property="og:title" content="Dashboard | TurboFlow" />
  <meta property="og:description" content="Simulations currently running, and their progress." />
  <meta property="og:url" content="https://turboflow-test.web.app/dashboard" />
  <meta property="og:image" content="https://turboflow-test.web.app/og-image.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:image:alt" content="The TurboFlow dashboard, showing the simulation list and credit balance." />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="description" content="Simulations currently running, and their progress." />

  <!-- Fonts are the only render-blocking request left. preconnect opens the
       connections while the HTML is still parsing, and display=swap means text
       is readable before the webfont arrives rather than after. -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700&family=IBM+Plex+Mono:wght@400;600&display=swap" />

  <!-- Which Firebase project this build talks to. Deliberately unbundled, so
       switching between test and production is a file swap, not a rebuild. -->
  <script src="/firebase-config.js"></script>
  <!-- No theme boot script. The dashboard shares the Workbench's chrome,
       which is light in both themes on purpose: it sits next to a viewer whose
       white ground is part of how a result looks. -->
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/entries/dashboard.jsx"></script>
</body>
</html>
